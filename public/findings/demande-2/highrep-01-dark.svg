<text x="40" y="370" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="395" fill="#a0a0b0" font-size="12">ASML détient 100% du marché EUV (extreme ultraviolet) indispensable</text>
<text x="40" y="412" fill="#a0a0b0" font-size="12">pour fabriquer toutes les puces avancées (NVIDIA H100, Apple M, AMD MI300).</text>
<text x="40" y="429" fill="#a0a0b0" font-size="12">Aucun concurrent ne peut produire une machine EUV : monopole technique total.</text>
<text x="40" y="475" fill="#64748b" font-size="11">Source : SemiWiki, TrendForce, ASML 2025 Annual Report — données mai 2026</text>
</svg>
