<text x="575" y="305" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="700">0,82</text>
<text x="595" y="350" text-anchor="middle" fill="#d97706" font-size="10" font-weight="600">2,5 %</text>
<text x="400" y="100" text-anchor="middle" fill="#0a0a0e" font-size="14" font-weight="700">Total 2025 : 32,7 Mds € (+15,6 % vs 2024)</text>
<text x="400" y="120" text-anchor="middle" fill="#059669" font-size="11">Bénéfice net 9,6 Mds € (29,4 % du CA)</text>
<text x="400" y="420" text-anchor="middle" fill="#555" font-size="10">EUV (monopole mondial) + service récurrent : pilier de la profitabilité ASML</text>
