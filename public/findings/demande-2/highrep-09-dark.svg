<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Performance financière ASML 2025 : marge brute 51,8%</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Top 5 équipementiers semis comparés (marge brute %, fiscal 2024-2025)</text>
<g transform="translate(60,110)">
<g><text x="-10" y="32" fill="#fafafa" font-size="13" text-anchor="end">ASML</text>
<rect x="0" y="15" width="518" height="30" fill="#7c3aed"/>
<text x="528" y="35" fill="#fafafa" font-size="13" font-weight="700">51,8%</text></g>
<g transform="translate(0,55)"><text x="-10" y="32" fill="#fafafa" font-size="13" text-anchor="end">KLAC</text>
<rect x="0" y="15" width="610" height="30" fill="#06b6d4"/>
<text x="620" y="35" fill="#fafafa" font-size="13" font-weight="700">61,0%</text></g>
<g transform="translate(0,110)"><text x="-10" y="32" fill="#fafafa" font-size="13" text-anchor="end">LRCX</text>
<rect x="0" y="15" width="480" height="30" fill="#06b6d4"/>
<text x="490" y="35" fill="#fafafa" font-size="13" font-weight="700">48,0%</text></g>
<g transform="translate(0,165)"><text x="-10" y="32" fill="#fafafa" font-size="13" text-anchor="end">AMAT</text>
<rect x="0" y="15" width="478" height="30" fill="#06b6d4"/>
<text x="488" y="35" fill="#fafafa" font-size="13" font-weight="700">47,8%</text></g>
<g transform="translate(0,220)"><text x="-10" y="32" fill="#fafafa" font-size="13" text-anchor="end">TEL (8035.T)</text>
<rect x="0" y="15" width="465" height="30" fill="#06b6d4"/>
<text x="475" y="35" fill="#fafafa" font-size="13" font-weight="700">46,5%</text></g>
</g>
<text x="40" y="395" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="420" fill="#a0a0b0" font-size="12">ASML génère 9,6 Mds € de bénéfice net en 2025 sur 32,7 Mds € de revenus.</text>
<text x="40" y="437" fill="#a0a0b0" font-size="12">Marge brute 51,8% : moins que KLAC (61%) mais sur des volumes bien plus grands.</text>
<text x="40" y="454" fill="#a0a0b0" font-size="12">Et marge en hausse +1,3 pts vs 2024 grâce au mix EUV qui monte.</text>
<text x="40" y="487" fill="#64748b" font-size="11">Source : ASML 2025 Annual Report (29 jan. 2026), rapports financiers pairs</text>
</svg>
