<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">High-NA EUV : 2,9× plus de transistors par exposition</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Saut technologique optique le plus important de l'histoire EUV</text>
<g transform="translate(80,110)">
<text x="120" y="30" fill="#fafafa" font-size="14" font-weight="600" text-anchor="middle">Low-NA (0.33)</text>
<rect x="20" y="40" width="200" height="200" fill="#1a1a24" stroke="#475569" rx="6"/>
<g fill="#475569"><circle cx="60" cy="80" r="6"/><circle cx="100" cy="80" r="6"/><circle cx="140" cy="80" r="6"/><circle cx="180" cy="80" r="6"/><circle cx="60" cy="120" r="6"/><circle cx="100" cy="120" r="6"/><circle cx="140" cy="120" r="6"/><circle cx="180" cy="120" r="6"/><circle cx="60" cy="160" r="6"/><circle cx="100" cy="160" r="6"/><circle cx="140" cy="160" r="6"/><circle cx="180" cy="160" r="6"/><circle cx="60" cy="200" r="6"/><circle cx="100" cy="200" r="6"/><circle cx="140" cy="200" r="6"/><circle cx="180" cy="200" r="6"/></g>
<text x="120" y="270" fill="#a0a0b0" font-size="13" text-anchor="middle">16 transistors</text>
<text x="120" y="288" fill="#a0a0b0" font-size="12" text-anchor="middle">Résolution 13 nm</text>
</g>
<text x="400" y="220" fill="#7c3aed" font-size="32" text-anchor="middle" font-weight="800">→</text>
<text x="400" y="250" fill="#10b981" font-size="14" text-anchor="middle" font-weight="700">×2,9</text>
<g transform="translate(460,110)">
<text x="120" y="30" fill="#fafafa" font-size="14" font-weight="600" text-anchor="middle">High-NA (0.55)</text>
<rect x="20" y="40" width="200" height="200" fill="#1a1a24" stroke="#7c3aed" stroke-width="2" rx="6"/>
<g fill="#7c3aed"><circle cx="40" cy="55" r="3.5"/><circle cx="65" cy="55" r="3.5"/><circle cx="90" cy="55" r="3.5"/><circle cx="115" cy="55" r="3.5"/><circle cx="140" cy="55" r="3.5"/><circle cx="165" cy="55" r="3.5"/><circle cx="190" cy="55" r="3.5"/><circle cx="40" cy="80" r="3.5"/><circle cx="65" cy="80" r="3.5"/><circle cx="90" cy="80" r="3.5"/><circle cx="115" cy="80" r="3.5"/><circle cx="140" cy="80" r="3.5"/><circle cx="165" cy="80" r="3.5"/><circle cx="190" cy="80" r="3.5"/><circle cx="40" cy="105" r="3.5"/><circle cx="65" cy="105" r="3.5"/><circle cx="90" cy="105" r="3.5"/><circle cx="115" cy="105" r="3.5"/><circle cx="140" cy="105" r="3.5"/><circle cx="165" cy="105" r="3.5"/><circle cx="190" cy="105" r="3.5"/><circle cx="40" cy="130" r="3.5"/><circle cx="65" cy="130" r="3.5"/><circle cx="90" cy="130" r="3.5"/><circle cx="115" cy="130" r="3.5"/><circle cx="140" cy="130" r="3.5"/><circle cx="165" cy="130" r="3.5"/><circle cx="190" cy="130" r="3.5"/><circle cx="40" cy="155" r="3.5"/><circle cx="65" cy="155" r="3.5"/><circle cx="90" cy="155" r="3.5"/><circle cx="115" cy="155" r="3.5"/><circle cx="140" cy="155" r="3.5"/><circle cx="165" cy="155" r="3.5"/><circle cx="190" cy="155" r="3.5"/><circle cx="40" cy="180" r="3.5"/><circle cx="65" cy="180" r="3.5"/><circle cx="90" cy="180" r="3.5"/><circle cx="115" cy="180" r="3.5"/><circle cx="140" cy="180" r="3.5"/><circle cx="165" cy="180" r="3.5"/><circle cx="190" cy="180" r="3.5"/><circle cx="40" cy="205" r="3.5"/><circle cx="65" cy="205" r="3.5"/><circle cx="90" cy="205" r="3.5"/><circle cx="115" cy="205" r="3.5"/><circle cx="140" cy="205" r="3.5"/><circle cx="165" cy="205" r="3.5"/><circle cx="190" cy="205" r="3.5"/></g>
<text x="120" y="270" fill="#fafafa" font-size="13" text-anchor="middle" font-weight="600">49 transistors</text>
<text x="120" y="288" fill="#fafafa" font-size="12" text-anchor="middle">Résolution 8 nm</text>
</g>
<text x="40" y="380" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="405" fill="#a0a0b0" font-size="12">La nouvelle machine High-NA d'ASML (EXE:5200B, 380 M$) permet de graver des</text>
<text x="40" y="422" fill="#a0a0b0" font-size="12">transistors 2,9× plus petits en une seule passe. C'est ce qui rend possibles</text>
<text x="40" y="439" fill="#a0a0b0" font-size="12">les puces 2nm de TSMC, Intel et Samsung en 2026-2027.</text>
<text x="40" y="478" fill="#64748b" font-size="11">Source : IEEE Spectrum « This Machine Could Keep Moore's Law on Track » 2025</text>
</svg>
