<text x="78" y="112" text-anchor="middle" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace">40</text>
<text data-axe="x" x="80" y="220" text-anchor="middle" fill="#444" font-size="13">Utilisent du</text>
<text data-axe="x" x="80" y="234.5" text-anchor="middle" fill="#444" font-size="13">surgelé tous</text>
