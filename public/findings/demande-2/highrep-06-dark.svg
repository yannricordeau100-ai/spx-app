<text x="130" y="50" fill="#fafafa" font-size="10" text-anchor="middle">31 EUV · 81 DUVi</text>
<rect x="210" y="172" width="30" height="48" fill="#7c3aed"/>
<rect x="245" y="42" width="30" height="178" fill="#06b6d4"/>
<text x="240" y="38" fill="#fafafa" font-size="10" text-anchor="middle">42 EUV · 113 DUVi</text>
<rect x="320" y="170" width="30" height="50" fill="#7c3aed"/>
<rect x="355" y="60" width="30" height="160" fill="#06b6d4"/>
<text x="350" y="55" fill="#fafafa" font-size="10" text-anchor="middle">40 EUV · 94 DUVi</text>
<rect x="430" y="160" width="30" height="60" fill="#7c3aed"/>
<rect x="465" y="34" width="30" height="186" fill="#06b6d4"/>
