<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="800" height="450" fill="#0a0a0a"/>
  <text x="400" y="28" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">DeepSeek-V3 vs concurrents — benchmarks officiels</text>
  <text x="400" y="48" font-size="11" fill="#525252" text-anchor="middle">Score (%) sur 6 benchmarks académiques · publié par DeepSeek-AI</text>

  <!-- Légende -->
  <g font-size="10" fill="#0a0a0a">
    <rect x="60" y="62" width="10" height="10" fill="#a78bfa"/><text x="74" y="71">DeepSeek-V3</text>
    <rect x="160" y="62" width="10" height="10" fill="#10b981"/><text x="174" y="71">Qwen2.5-72B</text>
    <rect x="265" y="62" width="10" height="10" fill="#06b6d4"/><text x="279" y="71">Llama-3.1-405B</text>
    <rect x="380" y="62" width="10" height="10" fill="#f59e0b"/><text x="394" y="71">GPT-4o</text>
    <rect x="450" y="62" width="10" height="10" fill="#f43f5e"/><text x="464" y="71">Claude-3.5-Sonnet</text>
  </g>

  <!-- Axes -->
  <line x1="60" y1="380" x2="760" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="60" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Y ticks -->
  <g font-size="9" fill="#525252" text-anchor="end">
    <text x="55" y="383">0</text>
    <text x="55" y="327">25</text>
    <text x="55" y="271">50</text>
    <text x="55" y="215">75</text>
    <text x="55" y="159">100</text>
    <line x1="60" y1="380" x2="760" y2="380" stroke="#e5e7eb"/>
    <line x1="60" y1="324" x2="760" y2="324" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
    <line x1="60" y1="268" x2="760" y2="268" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
    <line x1="60" y1="212" x2="760" y2="212" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
    <line x1="60" y1="156" x2="760" y2="156" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
  </g>

  <!-- 6 groupes : MMLU-Pro, GPQA, MATH500, AIME2024, Codeforces, SWE-bench -->
  <!-- Group spacing: largeur 700 / 6 = ~115 par groupe. 5 barres de 16 + gaps -->
  <!-- Helper : y = 380 - (val * 2.24) -->

  <!-- MMLU-Pro -->
  <g transform="translate(80,0)">
    <rect x="0" y="212" width="16" height="168" fill="#a78bfa"/>
    <rect x="18" y="227" width="16" height="153" fill="#10b981"/>
    <rect x="36" y="220" width="16" height="160" fill="#06b6d4"/>
    <rect x="54" y="216" width="16" height="164" fill="#f59e0b"/>
    <rect x="72" y="212" width="16" height="168" fill="#f43f5e"/>
    <text x="44" y="207" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">75.9</text>
    <text x="44" y="395" font-size="10" fill="#525252" text-anchor="middle">MMLU-Pro</text>
  </g>
  <!-- GPQA Diamond -->
  <g transform="translate(196,0)">
    <rect x="0" y="248" width="16" height="132" fill="#a78bfa"/>
    <rect x="18" y="276" width="16" height="104" fill="#10b981"/>
    <rect x="36" y="289" width="16" height="91" fill="#06b6d4"/>
    <rect x="54" y="269" width="16" height="111" fill="#f59e0b"/>
    <rect x="72" y="235" width="16" height="145" fill="#f43f5e"/>
    <text x="44" y="243" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">59.1</text>
    <text x="44" y="395" font-size="10" fill="#525252" text-anchor="middle">GPQA-Diamond</text>
  </g>
  <!-- MATH 500 -->
  <g transform="translate(312,0)">
    <rect x="0" y="178" width="16" height="202" fill="#a78bfa"/>
    <rect x="18" y="192" width="16" height="188" fill="#10b981"/>
    <rect x="36" y="213" width="16" height="167" fill="#06b6d4"/>
    <rect x="54" y="211" width="16" height="169" fill="#f59e0b"/>
    <rect x="72" y="204" width="16" height="176" fill="#f43f5e"/>
    <text x="44" y="173" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">90.2</text>
    <text x="44" y="395" font-size="10" fill="#525252" text-anchor="middle">MATH-500</text>
  </g>
  <!-- AIME 2024 -->
  <g transform="translate(428,0)">
    <rect x="0" y="292" width="16" height="88" fill="#a78bfa"/>
    <rect x="18" y="343" width="16" height="37" fill="#10b981"/>
    <rect x="36" y="346" width="16" height="34" fill="#06b6d4"/>
    <rect x="54" y="359" width="16" height="21" fill="#f59e0b"/>
    <rect x="72" y="343" width="16" height="37" fill="#f43f5e"/>
    <text x="44" y="287" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">39.2</text>
    <text x="44" y="395" font-size="10" fill="#525252" text-anchor="middle">AIME 2024</text>
  </g>
  <!-- Codeforces -->
  <g transform="translate(544,0)">
    <rect x="0" y="265" width="16" height="115" fill="#a78bfa"/>
    <rect x="18" y="304" width="16" height="76" fill="#10b981"/>
    <rect x="36" y="328" width="16" height="52" fill="#06b6d4"/>
    <rect x="54" y="335" width="16" height="45" fill="#f59e0b"/>
    <rect x="72" y="335" width="16" height="45" fill="#f43f5e"/>
    <text x="44" y="260" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">51.6</text>
    <text x="44" y="395" font-size="10" fill="#525252" text-anchor="middle">Codeforces</text>
  </g>
  <!-- SWE-bench -->
  <g transform="translate(660,0)">
    <rect x="0" y="286" width="16" height="94" fill="#a78bfa"/>
    <rect x="18" y="307" width="16" height="73" fill="#10b981"/>
    <rect x="36" y="327" width="16" height="53" fill="#06b6d4"/>
    <rect x="54" y="293" width="16" height="87" fill="#f59e0b"/>
    <rect x="72" y="266" width="16" height="114" fill="#f43f5e"/>
    <text x="44" y="281" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">42.0</text>
    <text x="44" y="395" font-size="10" fill="#525252" text-anchor="middle">SWE-bench</text>
  </g>

  <text x="60" y="125" font-size="10" fill="#525252">Accuracy / Percentile (%)</text>
  <text x="60" y="430" font-size="10" fill="#525252">DeepSeek-V3 surpasse Qwen2.5, Llama-3.1, GPT-4o et Claude-3.5-Sonnet sur math &amp; code.</text>
</svg>
