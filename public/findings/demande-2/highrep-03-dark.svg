<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Carnet de commandes ASML : 38,8 Mds €</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Backlog fin 2025, visibilité sur ~2 ans de production</text>
<g transform="translate(60,110)">
<text x="0" y="20" fill="#a0a0b0" font-size="11">Mds €</text>
<line x1="40" y1="220" x2="720" y2="220" stroke="#475569"/>
<line x1="40" y1="20" x2="40" y2="220" stroke="#475569"/>
<g fill="#a0a0b0" font-size="10" text-anchor="end">
<text x="35" y="225">0</text><text x="35" y="175">10</text><text x="35" y="125">20</text><text x="35" y="75">30</text><text x="35" y="25">40</text>
</g>
<g fill="#a0a0b0" font-size="11" text-anchor="middle">
<text x="100" y="240">2021</text><text x="220" y="240">2022</text><text x="340" y="240">2023</text><text x="460" y="240">2024</text><text x="580" y="240">2025</text><text x="680" y="240">Q4'25</text>
</g>
<rect x="70" y="100" width="60" height="120" fill="#06b6d4" opacity="0.7"/>
<text x="100" y="93" fill="#fafafa" font-size="11" text-anchor="middle" font-weight="600">24,0</text>
<rect x="190" y="50" width="60" height="170" fill="#06b6d4" opacity="0.8"/>
<text x="220" y="43" fill="#fafafa" font-size="11" text-anchor="middle" font-weight="600">34,1</text>
<rect x="310" y="30" width="60" height="190" fill="#06b6d4" opacity="0.85"/>
<text x="340" y="23" fill="#fafafa" font-size="11" text-anchor="middle" font-weight="600">37,9</text>
<rect x="430" y="40" width="60" height="180" fill="#06b6d4" opacity="0.85"/>
<text x="460" y="33" fill="#fafafa" font-size="11" text-anchor="middle" font-weight="600">36,0</text>
<rect x="550" y="26" width="60" height="194" fill="#7c3aed"/>
<text x="580" y="19" fill="#fafafa" font-size="11" text-anchor="middle" font-weight="700">38,8</text>
<rect x="650" y="155" width="60" height="65" fill="#10b981"/>
<text x="680" y="148" fill="#fafafa" font-size="11" text-anchor="middle" font-weight="700">+13,2</text>
</g>
<text x="650" y="395" fill="#10b981" font-size="11" text-anchor="middle">prises Q4'25</text>
<text x="40" y="380" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="405" fill="#a0a0b0" font-size="12">ASML a 38,8 Mds € de commandes fermes, dont 7,4 Mds € de nouvelles</text>
<text x="40" y="422" fill="#a0a0b0" font-size="12">commandes EUV au seul Q4 2025. Cela représente plus d'un an de chiffre</text>
<text x="40" y="439" fill="#a0a0b0" font-size="12">d'affaires futur déjà sécurisé. Aucun équipementier ne s'approche de ce niveau.</text>
<text x="40" y="478" fill="#64748b" font-size="11">Source : ASML 2025 Annual Report, communiqué résultats Q4 2025 (29 jan. 2026)</text>
</svg>
