<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 4096" width="4096" height="4096">
  <defs>
    <linearGradient id="barLight" x1="650" y1="0" x2="3450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8c8c8f"/>
      <stop offset="0.48" stop-color="#c9c9cd"/>
      <stop offset="1" stop-color="#f1f1f5"/>
    </linearGradient>
    <linearGradient id="barLower" x1="650" y1="0" x2="3450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="0.55" stop-color="#444446"/>
      <stop offset="1" stop-color="#6f6f72"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="2900" y1="2520" x2="3460" y2="2520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0878ff"/>
      <stop offset="0.48" stop-color="#4b22ff"/>
      <stop offset="1" stop-color="#ff00d4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Barre courbe haute -->
    <path d="M 640 2090 C 1360 2050 1880 2030 2195 1705 C 2450 1440 2815 1140 3395 890"
