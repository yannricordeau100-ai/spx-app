<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Exposition Chine ASML : descend de 36% à 19%</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Part des ventes système en Chine par trimestre, sous restrictions export US</text>
<g transform="translate(60,110)">
<line x1="50" y1="240" x2="720" y2="240" stroke="#475569"/>
<line x1="50" y1="20" x2="50" y2="240" stroke="#475569"/>
<g fill="#a0a0b0" font-size="10" text-anchor="end">
<text x="45" y="245">0%</text><text x="45" y="195">10%</text><text x="45" y="145">20%</text><text x="45" y="95">30%</text><text x="45" y="45">40%</text>
</g>
<polyline fill="none" stroke="#06b6d4" stroke-width="3" points="100,60 200,52 300,40 400,40 500,80 600,150 700,170"/>
<g fill="#06b6d4"><circle cx="100" cy="60" r="5"/><circle cx="200" cy="52" r="5"/><circle cx="300" cy="40" r="5"/><circle cx="400" cy="40" r="5"/><circle cx="500" cy="80" r="5"/><circle cx="600" cy="150" r="6" fill="#f97316"/><circle cx="700" cy="170" r="7" fill="#ef4444"/></g>
<g fill="#fafafa" font-size="11" text-anchor="middle">
<text x="100" y="50">36%</text><text x="200" y="42">38%</text><text x="300" y="30">42%</text><text x="400" y="30">42%</text><text x="500" y="70">34%</text><text x="600" y="140" fill="#f97316" font-weight="700">27%</text><text x="700" y="160" fill="#ef4444" font-weight="700">19%</text>
</g>
<g fill="#a0a0b0" font-size="10" text-anchor="middle">
<text x="100" y="258">Q1 24</text><text x="200" y="258">Q2 24</text><text x="300" y="258">Q3 24</text><text x="400" y="258">Q4 24</text><text x="500" y="258">Q1 25</text><text x="600" y="258">Q4 25</text><text x="700" y="258">Q1 26</text>
</g>
<line x1="550" y1="20" x2="550" y2="240" stroke="#ef4444" stroke-dasharray="4,3" opacity="0.6"/>
<text x="555" y="30" fill="#ef4444" font-size="10">Sanctions Biden Oct 2024</text>
<line x1="680" y1="20" x2="680" y2="240" stroke="#ef4444" stroke-dasharray="4,3" opacity="0.6"/>
<text x="660" y="30" fill="#ef4444" font-size="10" text-anchor="end">MATCH Act 04/26</text>
</g>
<text x="40" y="395" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="420" fill="#a0a0b0" font-size="12">La Chine pesait 42% des ventes système ASML en 2024 ; ce n'est plus que 19% en Q1 2026.</text>
<text x="40" y="437" fill="#a0a0b0" font-size="12">Conséquence positive : la dépendance géopolitique baisse fortement. ASML compense</text>
<text x="40" y="454" fill="#a0a0b0" font-size="12">par la demande IA des USA, Taïwan, Corée (TSM, Samsung, Intel) en croissance +20%.</text>
<text x="40" y="487" fill="#64748b" font-size="11">Source : Reuters, CNBC, ASML résultats Q1 2026 (15 avril 2026)</text>
</svg>
