<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" width="1024" height="320">
  <defs>
    <linearGradient id="curveGradD1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d0d0d0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="curveGradD2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6e6e6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a9a9a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="curveGradD3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bdbdbd" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7a7a7a" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="triangleGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="dotGlowD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon: 3 ascending curves + triangle play + flat base -->
  <g transform="translate(40,60)">
    <!-- Curve top -->
    <path d="M 0 30 C 60 30, 80 0, 180 0" stroke="url(#curveGradD1)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Curve middle -->
    <path d="M 0 80 C 60 80, 80 50, 180 50" stroke="url(#curveGradD2)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Curve bottom -->
    <path d="M 0 130 C 60 130, 80 100, 180 100" stroke="url(#curveGradD3)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Flat base bar -->
    <rect x="0" y="170" width="180" height="14" rx="7" fill="#888888" opacity="0.7"/>
    <!-- Triangle play sticker (purple-pink gradient) -->
    <polygon points="84,110 132,135 84,160" fill="url(#triangleGradD)" stroke="#ffffff" stroke-width="1" opacity="0.95"/>
  </g>

  <!-- Wordmark "MettrikAI" en italic, blanc -->
  <g transform="translate(260,210)">
    <text x="0" y="0"
          font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif"
          font-size="200"
          font-style="italic"
          font-weight="800"
          letter-spacing="-6"
          fill="#ffffff">MettrikAI</text>
    <!-- Glowing dot on the "i" (estimated x position based on text width) -->
    <circle cx="610" cy="-160" r="22" fill="url(#dotGlowD)"/>
    <circle cx="610" cy="-160" r="9" fill="#ffffff"/>
  </g>
</svg>
