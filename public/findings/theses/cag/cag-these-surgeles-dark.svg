<text data-axe="x" x="195" y="389.5" text-anchor="middle" fill="#bbb" font-size="11">Utilisent du surgelé tous les deux ou trois</text>
<text data-axe="x" x="195" y="402" text-anchor="middle" fill="#bbb" font-size="11">jours ou tous les jours</text>
