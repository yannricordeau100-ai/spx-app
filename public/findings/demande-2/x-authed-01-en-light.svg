<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:MtMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#fafafa"/>
<line x1="80" y1="100" x2="770" y2="100" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="104" text-anchor="end" fill="#666" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">30 $B</text>
<line x1="80" y1="180" x2="770" y2="180" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="184" text-anchor="end" fill="#666" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">20 $B</text>
<line x1="80" y1="260" x2="770" y2="260" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="264" text-anchor="end" fill="#666" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">10 $B</text>
<line x1="80" y1="340" x2="770" y2="340" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="344" text-anchor="end" fill="#666" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">0 $B</text>
<rect x="220" y="265" width="160" height="75" fill="#eab308" rx="4"/>
<text x="300" y="260" text-anchor="middle" fill="#0a0a0e" font-size="16" font-weight="700" font-family="MtMono, 'JetBrains Mono', monospace">$9.4 B</text>
<text x="300" y="380" text-anchor="middle" fill="#444" font-size="13" font-weight="600">2023</text>
<rect x="500" y="138" width="160" height="202" fill="#2563eb" rx="4"/>
<text x="580" y="133" text-anchor="middle" fill="#0a0a0e" font-size="16" font-weight="700" font-family="MtMono, 'JetBrains Mono', monospace">$25.3 B</text>
<text x="580" y="380" text-anchor="middle" fill="#444" font-size="13" font-weight="600">2028</text>
<text x="440" y="400" text-anchor="middle" fill="#059669" font-size="13" font-weight="600">CAGR 21.8 % per year</text>
<text x="40" y="430" fill="#666" font-size="10">ASML captures ~100 % of EUV lithography demand. Every chip below 7 nm requires its machines.</text>
</svg>
