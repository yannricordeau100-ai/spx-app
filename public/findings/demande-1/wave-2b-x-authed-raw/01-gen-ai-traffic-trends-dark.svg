<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#0a0a0e"/>
<text x="400" y="46" text-anchor="middle" fill="#888" font-size="11">Visites moyennes/jour (millions) · variation 4 semaines</text>
<!-- Bars horizontaux : ChatGPT 182.8M, Gemini 91.6M, Claude 26.8M, DeepSeek 13.3M, Grok 9.5M, Perplexity 5.2M -->
<!-- xmax=182.8 -> width 600 max, x0=210 -->
<g font-family="MtMono, 'JetBrains Mono', monospace" font-size="11">
<!-- ChatGPT -->
<text x="200" y="92" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">ChatGPT</text>
<rect x="210" y="78" width="600" height="22" fill="#a78bfa" rx="3"/>
<text x="816" y="93" fill="#fafafa">182.8M</text>
<text x="500" y="93" text-anchor="middle" fill="#0a0a0e" font-weight="600">+5%</text>
<!-- Gemini : 91.6 -> 600*91.6/182.8=300.7 -->
<text x="200" y="132" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Gemini</text>
<rect x="210" y="118" width="301" height="22" fill="#10b981" rx="3"/>
<text x="517" y="133" fill="#fafafa">91.6M</text>
<text x="360" y="133" text-anchor="middle" fill="#0a0a0e" font-weight="600">+9%</text>
<!-- Claude : 26.8 -> 88 -->
<text x="200" y="172" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Claude</text>
<rect x="210" y="158" width="88" height="22" fill="#06b6d4" rx="3"/>
<text x="304" y="173" fill="#fafafa">26.8M (+26%)</text>
<!-- DeepSeek : 13.3 -> 43.7 -->
<text x="200" y="212" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">DeepSeek</text>
<rect x="210" y="198" width="44" height="22" fill="#f59e0b" rx="3"/>
<text x="260" y="213" fill="#fafafa">13.3M (+32%)</text>
<!-- Grok : 9.5 -> 31.2 -->
<text x="200" y="252" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Grok</text>
<rect x="210" y="238" width="31" height="22" fill="#f43f5e" rx="3"/>
<text x="247" y="253" fill="#fafafa">9.5M (-21%)</text>
<!-- Perplexity : 5.2 -> 17 -->
<text x="200" y="292" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Perplexity</text>
<rect x="210" y="278" width="17" height="22" fill="#3b82f6" rx="3"/>
<text x="233" y="293" fill="#fafafa">5.2M (+2%)</text>
</g>
<g transform="translate(0,330)">
<rect x="60" y="0" width="700" height="80" fill="#11111a" rx="6" stroke="#1f1f24"/>
<text x="80" y="22" fill="#fafafa" font-size="12" font-weight="600">Lecture</text>
<text x="80" y="42" fill="#bbb" font-size="11">ChatGPT domine avec 182.8M visites/jour. Claude (+26%) et DeepSeek (+32%)</text>
<text x="80" y="58" fill="#bbb" font-size="11">croissent le plus vite. Grok recule de 21% sur 4 semaines.</text>
</g>
</svg>
