<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui">
<rect width="800" height="450" fill="#0a0a0e"/>
<text x="400" y="48" text-anchor="middle" fill="#888" font-size="11">Stranger ou candidat s&#233;rieux : valuation 200 Mds $ d&#233;but 2026</text>
<text x="210" y="100" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Utilisateurs X (MAU)</text>
<rect x="220" y="85" width="500" height="22" fill="#3b82f6" rx="3"/>
<text x="728" y="100" fill="#fafafa" font-size="11" font-family="ui-monospace">550 M</text>
<text x="210" y="135" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Premium+ (acc&#232;s Grok)</text>
<rect x="220" y="120" width="14" height="22" fill="#a78bfa" rx="3"/>
<text x="242" y="135" fill="#fafafa" font-size="11" font-family="ui-monospace">12 M</text>
<text x="210" y="170" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Grok WAU r&#233;el</text>
<rect x="220" y="155" width="40" height="22" fill="#f43f5e" rx="3"/>
<text x="268" y="170" fill="#fafafa" font-size="11" font-family="ui-monospace">35 M</text>
<text x="210" y="205" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Revenu xAI 2026e</text>
<rect x="220" y="190" width="60" height="22" fill="#f59e0b" rx="3"/>
<text x="288" y="205" fill="#fafafa" font-size="11" font-family="ui-monospace">1,5 Mds $</text>
<text x="210" y="240" text-anchor="end" fill="#fafafa" font-size="12" font-weight="600">Valuation xAI 2026</text>
<rect x="220" y="225" width="400" height="22" fill="#10b981" rx="3"/>
<text x="628" y="240" fill="#fafafa" font-size="11" font-family="ui-monospace">200 Mds $</text>
<g transform="translate(0,290)"><rect x="60" y="0" width="700" height="130" fill="#11111a" rx="6" stroke="#1f1f24"/>
<text x="80" y="22" fill="#fafafa" font-size="12" font-weight="600">Lecture</text>
<text x="80" y="42" fill="#bbb" font-size="11">Grok b&#233;n&#233;ficie de l&apos;audience X (550 M MAU) mais ne convertit que 2 %.</text>
<text x="80" y="58" fill="#bbb" font-size="11">Revenu 2026 sous 2 Mds $ : 30x moins qu&apos;OpenAI / Anthropic.</text>
<text x="80" y="74" fill="#bbb" font-size="11">Mais valuation 200 Mds $ : pari sur le hardware (Colossus) + synergies Tesla / xAI.</text>
<text x="80" y="90" fill="#bbb" font-size="11">Mod&#232;le Grok 4 / 5 progresse rapide sur les benchmarks mais reste niche.</text>
<text x="80" y="106" fill="#bbb" font-size="11">Stratechery : &quot;Grok rest&#233; en queue de peloton sur l&apos;adoption grand public&quot;.</text>
</g>
</svg>
