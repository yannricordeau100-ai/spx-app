<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:MtMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#0a0a0e"/>
<!-- Y axis 45-58 -->
<line x1="80" y1="100" x2="770" y2="100" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="104" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">58 %</text>
<line x1="80" y1="170" x2="770" y2="170" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="174" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">55 %</text>
<line x1="80" y1="240" x2="770" y2="240" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="244" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">52 %</text>
<line x1="80" y1="310" x2="770" y2="310" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="314" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">49 %</text>
