<text x="45" y="225">0</text><text x="45" y="180">30</text><text x="45" y="140">60</text><text x="45" y="100">90</text><text x="45" y="60">120</text><text x="45" y="20">150</text>
</g>
<g fill="#a0a0b0" font-size="11" text-anchor="middle">
<text x="130" y="240">2020</text><text x="240" y="240">2021</text><text x="350" y="240">2022</text><text x="460" y="240">2023</text><text x="570" y="240">2024</text><text x="680" y="240">2025</text>
</g>
<rect x="100" y="186" width="30" height="34" fill="#7c3aed"/>
