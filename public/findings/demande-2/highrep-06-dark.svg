<g transform="translate(60,365)">
<rect x="0" y="0" width="14" height="14" fill="#7c3aed"/><text x="22" y="12" fill="#fafafa" font-size="11">EUV (extreme ultraviolet)</text>
<rect x="200" y="0" width="14" height="14" fill="#06b6d4"/><text x="222" y="12" fill="#fafafa" font-size="11">DUV immersion</text>
</g>
<text x="40" y="410" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="435" fill="#a0a0b0" font-size="12">ASML expédie ~50 machines EUV par an. Comme chaque machine vaut 180-380 M$,</text>
<text x="40" y="452" fill="#a0a0b0" font-size="12">EUV représente 48% du chiffre d'affaires 2025 (contre 37% en 2022).</text>
<text x="40" y="492" fill="#64748b" font-size="11">Source : Counterpoint Research, communiqués trimestriels ASML 2020-2025</text>
</svg>
