<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" width="1024" height="320">
  <defs>
    <linearGradient id="curveGradL1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a9a9a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4a4a4a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="curveGradL2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b0b0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5a5a5a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="curveGradL3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4c4c4" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6a6a6a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="triangleGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(40,60)">
    <path d="M 0 30 C 60 30, 80 0, 180 0" stroke="url(#curveGradL1)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 0 80 C 60 80, 80 50, 180 50" stroke="url(#curveGradL2)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 0 130 C 60 130, 80 100, 180 100" stroke="url(#curveGradL3)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <rect x="0" y="170" width="180" height="14" rx="7" fill="#7a7a7a" opacity="0.6"/>
    <polygon points="84,110 132,135 84,160" fill="url(#triangleGradL)" opacity="0.95"/>
  </g>

  <!-- Wordmark "MettrikAI" en noir -->
  <g transform="translate(260,210)">
    <text x="0" y="0"
          font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif"
          font-size="200"
          font-style="italic"
          font-weight="800"
          letter-spacing="-6"
          fill="#0a0a0a">MettrikAI</text>
  </g>
</svg>
