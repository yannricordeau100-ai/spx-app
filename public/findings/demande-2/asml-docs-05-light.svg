<text x="230" y="350" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">36,7 % du revenu</text>
<text x="230" y="366" text-anchor="middle" fill="#555" font-size="10">-6 % vs 2024</text>
<text x="370" y="180" fill="#333" font-size="12">Service &amp; upgrades</text>
<rect x="370" y="160" width="151" height="60" fill="#0891b2" rx="3"/>
<text x="445" y="195" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">8,2 Mds €</text>
