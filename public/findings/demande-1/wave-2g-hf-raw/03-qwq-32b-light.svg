    <rect x="22" y="220" width="20" height="160" fill="#10b981"/>
    <rect x="44" y="248" width="20" height="132" fill="#06b6d4"/>
    <rect x="66" y="250" width="20" height="130" fill="#f59e0b"/>
    <rect x="88" y="258" width="20" height="122" fill="#f43f5e"/>
