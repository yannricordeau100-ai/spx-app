<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Monopole ASML sur EUV : 100% du marché</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Part de marché des équipements lithographiques avancés (2025)</text>
<g transform="translate(60,110)">
<rect x="0" y="0" width="700" height="50" fill="#1a1a24" rx="4"/>
<rect x="0" y="0" width="700" height="50" fill="#7c3aed" rx="4"/>
<text x="350" y="32" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">ASML : 100% EUV (sub-7nm, 5nm, 3nm, 2nm)</text>
<text x="-10" y="32" text-anchor="end" fill="#fafafa" font-size="13">EUV</text>
</g>
<g transform="translate(60,180)">
<rect x="0" y="0" width="700" height="50" fill="#1a1a24" rx="4"/>
<rect x="0" y="0" width="574" height="50" fill="#06b6d4" rx="4"/>
<text x="287" y="32" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">ASML : 82%</text>
<rect x="574" y="0" width="80" height="50" fill="#475569" rx="0"/>
<text x="614" y="32" text-anchor="middle" fill="#fff" font-size="12">Nikon 11%</text>
<rect x="654" y="0" width="46" height="50" fill="#64748b" rx="0"/>
<text x="677" y="32" text-anchor="middle" fill="#fff" font-size="11">Canon 7%</text>
<text x="-10" y="32" text-anchor="end" fill="#fafafa" font-size="13">Photo-litho global</text>
</g>
<g transform="translate(60,250)">
<rect x="0" y="0" width="700" height="50" fill="#1a1a24" rx="4"/>
<rect x="0" y="0" width="175" height="50" fill="#10b981" rx="4"/>
<text x="87" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ASML 25%</text>
<rect x="175" y="0" width="119" height="50" fill="#475569"/>
<text x="234" y="32" text-anchor="middle" fill="#fff" font-size="11">AMAT 17%</text>
<rect x="294" y="0" width="98" height="50" fill="#64748b"/>
<text x="343" y="32" text-anchor="middle" fill="#fff" font-size="11">LRCX 14%</text>
<rect x="392" y="0" width="84" height="50" fill="#94a3b8"/>
<text x="434" y="32" text-anchor="middle" fill="#fff" font-size="11">TEL 12%</text>
