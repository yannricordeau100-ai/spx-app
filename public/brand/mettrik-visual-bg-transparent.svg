    <path d="M 640 2555 C 1420 2545 1880 2510 2265 2215 C 2600 1960 3040 1780 3405 1685"
          fill="none" stroke="url(#barLight)" stroke-width="220" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Barre droite basse -->
    <path d="M 640 3050 L 3405 3050"
          fill="none" stroke="#050505" stroke-width="250" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 640 3050 L 3405 3050"
