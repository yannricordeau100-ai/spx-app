<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:MtMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#fafafa"/>
<rect x="60" y="90" width="320" height="160" fill="#ffffff" stroke="#059669" rx="6"/>
<text x="220" y="116" text-anchor="middle" fill="#059669" font-size="13" font-weight="700">Retour aux actionnaires 2025</text>
<text x="80" y="148" fill="#333" font-size="11">Dividende total déclaré</text>
<text x="360" y="148" text-anchor="end" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">7,50 € / action</text>
<text x="80" y="174" fill="#333" font-size="11">Cash retourné en 2025</text>
<text x="360" y="174" text-anchor="end" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">8,5 Mds €</text>
<text x="80" y="200" fill="#333" font-size="11">Rachats actions Q4 2025</text>
<text x="360" y="200" text-anchor="end" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">1,7 Md €</text>
<text x="80" y="226" fill="#0891b2" font-size="11" font-weight="600">Nouveau buyback annoncé</text>
<text x="360" y="226" text-anchor="end" fill="#0891b2" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">12 Mds €</text>
<text x="220" y="244" text-anchor="middle" fill="#555" font-size="10">(à exécuter d'ici décembre 2028)</text>
<rect x="420" y="90" width="320" height="160" fill="#ffffff" stroke="#7c3aed" rx="6"/>
<text x="580" y="116" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="700">Ambition long-terme 2030</text>
<text x="440" y="148" fill="#333" font-size="11">Revenu annuel cible</text>
<text x="720" y="148" text-anchor="end" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">44 - 60 Mds €</text>
<text x="440" y="174" fill="#333" font-size="11">Marge brute cible</text>
<text x="720" y="174" text-anchor="end" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">56 - 60 %</text>
<text x="440" y="200" fill="#333" font-size="11">Marché semi-conducteurs</text>
<text x="720" y="200" text-anchor="end" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">&gt; 1000 Mds $</text>
<text x="440" y="226" fill="#0891b2" font-size="11" font-weight="600">Croissance vs 2025 (mid)</text>
<text x="720" y="226" text-anchor="end" fill="#0891b2" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace" font-weight="700">+59 %</text>
<text x="580" y="244" text-anchor="middle" fill="#555" font-size="10">(scenarios Investor Day nov 2024)</text>
<rect x="60" y="280" width="680" height="140" fill="#ffffff" stroke="#e2e2e8" rx="6"/>
<text x="80" y="306" fill="#0a0a0e" font-size="13" font-weight="700">Pourquoi ASML peut tenir ses cibles 2030</text>
<text x="80" y="332" fill="#059669" font-size="11" font-weight="600">→ Monopole EUV</text>
<text x="220" y="332" fill="#333" font-size="11">100 % part de marché lithographie EUV (TSMC, Samsung, Intel, SK Hynix)</text>
<text x="80" y="356" fill="#059669" font-size="11" font-weight="600">→ Pricing power</text>
<text x="220" y="356" fill="#333" font-size="11">Machines High-NA EXE:5200B : ~350 M € l'unité, ~150 brevets EUV core</text>
<text x="80" y="380" fill="#059669" font-size="11" font-weight="600">→ Récurrent fort</text>
<text x="220" y="380" fill="#333" font-size="11">Service base installée : +26 % à 8,2 Mds € en 2025, marge supérieure aux systèmes</text>
<text x="80" y="404" fill="#059669" font-size="11" font-weight="600">→ Backlog visible</text>
<text x="220" y="404" fill="#333" font-size="11">38,8 Mds € en carnet = 1,2× le CA 2025, sécurise 2026 et début 2027</text>
</svg>
