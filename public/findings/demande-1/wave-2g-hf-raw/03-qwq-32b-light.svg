    <text x="55" y="327">25</text>
    <text x="55" y="271">50</text>
    <text x="55" y="215">75</text>
    <text x="55" y="159">100</text>
    <line x1="60" y1="324" x2="760" y2="324" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
    <line x1="60" y1="268" x2="760" y2="268" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
    <line x1="60" y1="212" x2="760" y2="212" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
    <line x1="60" y1="156" x2="760" y2="156" stroke="#e5e7eb" stroke-dasharray="2,3" opacity="0.5"/>
  </g>

  <!-- 5 groupes, largeur ~140 par groupe, 5 barres -->
  <!-- AIME24 : 79.5, 79.8, 63.6, 70.0, 72.6 -->
  <g transform="translate(90,0)">
