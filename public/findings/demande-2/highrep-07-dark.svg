<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Chaîne de valeur EUV : ASML au sommet, irremplaçable</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Les clients EUV d'ASML (TSM, Samsung, Intel) fournissent toute l'IA mondiale</text>
<g transform="translate(60,110)">
<rect x="240" y="0" width="220" height="60" fill="#a855f7" rx="6"/>
<text x="350" y="28" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">ASML</text>
<text x="350" y="48" fill="#fff" font-size="11" text-anchor="middle">Seul fournisseur EUV mondial</text>
<line x1="350" y1="60" x2="150" y2="100" stroke="#7c3aed" stroke-width="2"/>
<line x1="350" y1="60" x2="350" y2="100" stroke="#7c3aed" stroke-width="2"/>
<line x1="350" y1="60" x2="550" y2="100" stroke="#7c3aed" stroke-width="2"/>
<g transform="translate(60,100)"><rect width="180" height="50" fill="#1a1a24" stroke="#06b6d4" rx="4"/><text x="90" y="22" fill="#fafafa" font-size="13" font-weight="700" text-anchor="middle">TSMC (TSM)</text><text x="90" y="40" fill="#a0a0b0" font-size="10" text-anchor="middle">~55% des EUV installés</text></g>
<g transform="translate(260,100)"><rect width="180" height="50" fill="#1a1a24" stroke="#06b6d4" rx="4"/><text x="90" y="22" fill="#fafafa" font-size="13" font-weight="700" text-anchor="middle">Samsung (005930.KS)</text><text x="90" y="40" fill="#a0a0b0" font-size="10" text-anchor="middle">memory + foundry</text></g>
<g transform="translate(460,100)"><rect width="180" height="50" fill="#1a1a24" stroke="#06b6d4" rx="4"/><text x="90" y="22" fill="#fafafa" font-size="13" font-weight="700" text-anchor="middle">Intel (INTC)</text><text x="90" y="40" fill="#a0a0b0" font-size="10" text-anchor="middle">High-NA accepté 12/25</text></g>
<line x1="150" y1="150" x2="100" y2="200" stroke="#06b6d4" stroke-width="2"/>
<line x1="150" y1="150" x2="200" y2="200" stroke="#06b6d4" stroke-width="2"/>
<line x1="350" y1="150" x2="300" y2="200" stroke="#06b6d4" stroke-width="2"/>
<line x1="350" y1="150" x2="400" y2="200" stroke="#06b6d4" stroke-width="2"/>
<line x1="550" y1="150" x2="500" y2="200" stroke="#06b6d4" stroke-width="2"/>
<line x1="550" y1="150" x2="600" y2="200" stroke="#06b6d4" stroke-width="2"/>
<g transform="translate(30,200)"><rect width="140" height="40" fill="#10b981" rx="4"/><text x="70" y="25" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">NVIDIA H100/B200</text></g>
<g transform="translate(180,200)"><rect width="140" height="40" fill="#10b981" rx="4"/><text x="70" y="25" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Apple M5, A19</text></g>
<g transform="translate(330,200)"><rect width="140" height="40" fill="#10b981" rx="4"/><text x="70" y="25" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">AMD MI300/MI400</text></g>
<g transform="translate(480,200)"><rect width="140" height="40" fill="#10b981" rx="4"/><text x="70" y="25" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Google TPU</text></g>
<g transform="translate(630,200)"><rect width="60" height="40" fill="#10b981" rx="4"/><text x="30" y="25" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Qual.</text></g>
<text x="350" y="290" fill="#fafafa" font-size="14" font-weight="700" text-anchor="middle">↓ Toute la révolution IA dépend de cette pyramide</text>
</g>
<text x="40" y="445" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="470" fill="#a0a0b0" font-size="12">Sans ASML, pas de puces 3-2nm. Pas de puces 3-2nm, pas de GPU NVIDIA. Pas</text>
<text x="40" y="487" fill="#a0a0b0" font-size="12">de GPU NVIDIA, pas de ChatGPT, Gemini, Claude, Grok. ASML = goulot d'étranglement absolu.</text>
