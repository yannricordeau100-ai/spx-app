<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#0a0a0e"/>
<!-- Stacked bar : Total = 32.7. EUV = 11.6 (35.5%), DUV = 12.0 (36.7%), Metro+Insp = 0.825 (2.5%), IBM service = 8.2 (25.1%) -->
<!-- Bar from x=120 to x=720, width=600. Heights proportional. -->
<text x="100" y="180" fill="#bbb" font-size="12">EUV</text>
<rect x="120" y="160" width="213" height="60" fill="#10b981" rx="3"/>
<text x="226" y="195" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">11,6 Mds €</text>
<text x="226" y="240" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">35,5 % du revenu</text>
<text x="226" y="256" text-anchor="middle" fill="#888" font-size="10">+39 % vs 2024</text>
<text x="100" y="290" fill="#bbb" font-size="12">DUV</text>
<rect x="120" y="270" width="220" height="60" fill="#a78bfa" rx="3"/>
<text x="230" y="305" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">12,0 Mds €</text>
<text x="230" y="350" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">36,7 % du revenu</text>
<text x="230" y="366" text-anchor="middle" fill="#888" font-size="10">-6 % vs 2024</text>
<text x="370" y="180" fill="#bbb" font-size="12">Service &amp; upgrades</text>
<rect x="370" y="160" width="151" height="60" fill="#22d3ee" rx="3"/>
<text x="445" y="195" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">8,2 Mds €</text>
<text x="445" y="240" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">25,1 % du revenu</text>
<text x="445" y="256" text-anchor="middle" fill="#888" font-size="10">+26 % vs 2024 (récurrent)</text>
<text x="555" y="290" fill="#bbb" font-size="12">Metro &amp; Inspect</text>
<rect x="555" y="270" width="40" height="60" fill="#f59e0b" rx="3"/>
<text x="575" y="305" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="700">0,82</text>
<text x="595" y="350" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">2,5 %</text>
<text x="400" y="100" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="700">Total 2025 : 32,7 Mds € (+15,6 % vs 2024)</text>
<text x="400" y="120" text-anchor="middle" fill="#10b981" font-size="11">Bénéfice net 9,6 Mds € (29,4 % du CA)</text>
<text x="400" y="420" text-anchor="middle" fill="#888" font-size="10">EUV (monopole mondial) + service récurrent : pilier de la profitabilité ASML</text>
</svg>
