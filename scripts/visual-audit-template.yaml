# Mettrik visual audit template — Gemini 2.5 Flash
# IDs ALIGNÉS sur src/lib/quality-tree.ts (Quality Registry unique).
# Chaque check produit: { id, pass: bool, severity: 1-5, observation: str }
# Yann 16 mai 2026 — Phase 4 chantier Quality Registry.

version: 2

categories:
  - id: header
    label: Header (logo + chips + tagline)
    checks:
      - id: header.logo.real_brand
        question: "Le logo en haut à gauche est-il un vrai logo de marque (pas un cercle gradient violet/cyan avec 1-3 lettres = fallback monogramme) ?"
        severity_if_fail: 3
      - id: header.logo.readable_on_dark
        question: "Le logo est-il lisible sur fond sombre (contraste suffisant, ratio non écrasé) ?"
        severity_if_fail: 2
      - id: header.chips.all_filled
        question: "Les 6 CHIPS sous le nom de la sté (Rang mondial / Rang USA / TECHNOLOGIE / SOUS-SECTEUR / FONDÉE / IPO) sont-ils tous présents et remplis ? NE PAS confondre avec le bloc 'Capitalisation Boursière' à droite (qui est un bloc séparé, hors chips header). Pass=true même si la capi boursière est vide, tant que les 6 chips ci-dessus sont remplis."
        severity_if_fail: 3
      - id: header.chips.labels_fr
        question: "Les labels des chips sont-ils en français (Secteur / Sous-secteur / Fondée), pas en anglais (Sector / Sub-sector / Founded) ?"
        severity_if_fail: 2
      - id: header.chips.rank_format_uniform
        question: "Les rangs utilisent-ils un seul format cohérent (tous en '#N' OU tous en 'Top N %'), pas un mix sur la même page ?"
        severity_if_fail: 2

  - id: hero
    label: Hero (sidebar + chart + interpretation)
    checks:
      - id: hero.sidebar.value_plausible
        question: "La grosse valeur hero (chiffre central) a-t-elle une magnitude plausible pour cette société et ce KPI (pas 30 alors qu'on attend 194, pas 0, pas négatif si ça n'a pas de sens) ?"
        severity_if_fail: 5
      - id: hero.sidebar.unit_visible
        question: "L'unité du hero KPI est-elle affichée clairement à côté de la valeur (Mds $, $, %, M, ans) ?"
        severity_if_fail: 4
      - id: hero.sidebar.yoy_color_arrow
        question: "La pill YoY a-t-elle la bonne couleur (vert si positif, rouge si négatif) et une flèche cohérente ?"
        severity_if_fail: 3
      - id: hero.sidebar.cagr_no_infinity
        question: "Le badge CAGR n'affiche pas 'Infinity', 'NaN', '−Infinity' ni '+∞ %' ?"
        severity_if_fail: 5
      - id: hero.chart.y_axis.unit_label
        question: "L'axe Y du chart a-t-il un label d'unité explicite (ex '$ en Milliards', '$ en Millions', '%', 'Nombre') ?"
        severity_if_fail: 3
      - id: hero.chart.y_axis.no_overlap_with_tabs
        question: "L'axe Y (s'il est à droite) ne chevauche-t-il pas les onglets de personnalisation (period toggle / sub-toggle 2D-3D) ?"
        severity_if_fail: 3
      - id: hero.chart.no_linear_synthetic
        question: "Le sparkline / chart hero ne montre PAS une suite parfaitement linéaire (ex +5 chaque période × 8 = signature LLM fabriquée). Une vraie history a du bruit."
        severity_if_fail: 5
      - id: hero.chart.no_partial_year
        question: "Le chart EN VUE ANNUELLE (toggle 'Annuel' actif) ne montre AUCUN point d'année incomplète. Si la vue active est 'Trimestriel', skip ce check (pass=true)."
        severity_if_fail: 5
      - id: hero.chart.no_phantom_quarter
        question: "ATTENTION : la BANDE D'ANNÉES sous l'axe X (ex '2024', '2025', '2026') est un LABEL DE REGROUPEMENT, pas un point de données. Vérifier UNIQUEMENT que les POINTS PLOTTÉS (cercles bleus avec valeurs numériques au-dessus) ne dépassent pas le dernier trimestre publié. Si tu vois T1, T2, T3, T4 sous le label '2026' mais SANS valeur numérique au-dessus → ce sont des labels vides (FUTURS, pas affichés), donc PASS=true. Si tu vois 4 valeurs réelles plottées sous '2026', FAIL."
        severity_if_fail: 5
      - id: hero.chart.ttm_visible
        question: "TTM s'affiche UNIQUEMENT en VUE ANNUELLE. Si la vue active est 'Trimestriel' OU 'Semestriel', skip ce check (pass=true). En vue annuelle : si un point pointillé existe à droite du dernier point FY plein, sa valeur numérique doit être affichée en italique gris au-dessus."
        severity_if_fail: 3
      - id: hero.chart.events_dots.no_cluster_right
        question: "Les event dots (timeline) sont-ils espacés normalement le long de l'axe X, sans grappe à l'extrémité droite ?"
        severity_if_fail: 2
      - id: hero.chart.watermark.no_overlap_ttm_badge
        question: "Le watermark 'MettrikAI' ne se superpose pas avec le TTM badge ni avec d'autres labels du chart ?"
        severity_if_fail: 3
      - id: hero.chart.x_axis.no_overflow_right
        question: "Aucun label X ou point TTM n'est coupé par le bord droit du chart ?"
        severity_if_fail: 3

  - id: kpis_table
    label: Tableau Indicateurs clés
    checks:
      - id: kpis_table.count_5plus
        question: "La fiche affiche au moins 5 KPIs dans le tableau Indicateurs clés ?"
        severity_if_fail: 4
      - id: global.units.consistent_across_blocs
        question: "Les unités sont-elles cohérentes entre tous les blocs : 'Mds $' partout (pas un mix 'B$', '$B', 'Mds$', 'M$ ' collé) ?"
        severity_if_fail: 3
      - id: global.typography.nbsp_before_pct
        question: "Les pourcentages utilisent un espace insécable avant '%' (ex '6,9 %', pas '6.9%' format US) ?"
        severity_if_fail: 2
      - id: global.typography.fr_number_format
        question: "Les nombres sont au format FR ('1 234,56' / '6,9 %'), pas US ('1,234.56' / '6.9%') ?"
        severity_if_fail: 3
      - id: kpis_table.acronyms_tooltip
        question: "Les acronymes (DAP, EBITDA, TAC, ARR, CAGR, ROIC, etc.) ont-ils un tooltip 'i' à côté pour expliquer ?"
        severity_if_fail: 2
      - id: kpis_table.short_label_oneline
        question: "Les labels short de chaque KPI tiennent sur 1 ligne (pas tronqué, pas wrap moche, ≤30 chars) ?"
        severity_if_fail: 2

  - id: stories
    label: Stories carrousel
    checks:
      - id: stories.visible_at_least_3
        question: "Le bloc Stories (carrousel phone-frame 9:16 noir avec dots de pagination en haut) est-il présent SI ON SCROLLE assez bas dans le screenshot ? Si le screenshot ne descend pas assez et que tu ne vois ni Hero KPI ni indicateurs ni Stories : skip (pass=true). Si tu vois le bloc Stories mais 0 card visible : fail."
        severity_if_fail: 3
      - id: stories.no_template_llm
        question: "Si le bloc Stories est visible (carrousel phone-frame), ses cards ont du contenu concret (nom KPI + valeur + contexte), pas un template LLM vide ou 'Voir ci-dessous'. Si le bloc n'est PAS visible dans le screenshot : skip (pass=true)."
        severity_if_fail: 3

  - id: risks
    label: Facteurs de risque
    checks:
      - id: risks.count_3plus
        question: "Le bloc Risques affiche au moins 3 cards de risques ?"
        severity_if_fail: 3
      - id: risks.severity_score
        question: "Chaque risque a-t-il un score severity 1-5 visible (chip ou étoiles) ?"
        severity_if_fail: 2
      - id: risks.trend_chip
        question: "Chaque risque a un chip de trend (Nouveau / En hausse / Stable / En baisse / Retiré) ?"
        severity_if_fail: 1

  - id: governance
    label: Gouvernance & rémunération
    checks:
      - id: governance.ceo_name_correct
        question: "Le bloc Gouvernance affiche un nom de CEO non vide (et pas un nom évidemment faux comme un CEO de filiale ou d'une autre sté) ?"
        severity_if_fail: 3

  - id: ai_positioning
    label: Positionnement IA
    checks:
      - id: ai_positioning.stance_present
        question: "Le bloc Positionnement IA affiche une stance (leader / integrator / cautious / absent) ?"
        severity_if_fail: 2
      - id: ai_positioning.evidence_min_2
        question: "Le bloc Positionnement IA liste au moins 2 evidences concrètes (pas juste un placeholder) ?"
        severity_if_fail: 2

  - id: repartition
    label: Répartition revenu (segment / geo)
    checks:
      - id: repartition.segment_slices_2plus
        question: "Le bloc Répartition par segment affiche un pie/donut avec au moins 2 slices nommées ?"
        severity_if_fail: 2
      - id: repartition.geo_slices_2plus
        question: "Le bloc Répartition par géographie affiche un pie/donut avec au moins 2 slices nommées ?"
        severity_if_fail: 2
      - id: repartition.pct_sums_100
        question: "Les pourcentages des slices totalisent ~100 % (pas 30 % ou 200 %) ?"
        severity_if_fail: 3

  - id: freshness
    label: Fraîcheur / earning
    checks:
      - id: freshness.label_fr
        question: "Le label de fraîcheur est en français (À jour / Récent / Périmé), pas en anglais (Fresh / Recent / Stale) ?"
        severity_if_fail: 2

  - id: global
    label: Cohérence langue + typographie (page FR)
    checks:
      - id: global.lang.no_english_leak
        question: "Aucun mot anglais user-facing parasite (Industry, Sector, Founded, Read more, Loading, etc.) sur une page supposée FR ?"
        severity_if_fail: 2
      - id: global.typography.no_em_dash
        question: "Aucun em-dash '—' user-facing dans les textes ? (Mettrik bannit les em-dashes.)"
        severity_if_fail: 1
      - id: global.units.mds_not_b
        question: "Aucun format unité bâclé : pas de '12B$', pas de '60M$' collé, jamais '$B' ?"
        severity_if_fail: 2

  - id: layout
    label: Layout / rendu
    checks:
      - id: layout.no_horizontal_scroll
        question: "Aucun bloc ne déborde de son conteneur (pas de scroll horizontal de page, pas de texte qui sort de sa card) ?"
        severity_if_fail: 3
      - id: layout.no_broken_image
        question: "Aucune image cassée (icône broken-image, fond gris vide là où devrait être un logo / chart) ?"
        severity_if_fail: 4
      - id: layout.no_500_error
        question: "La page n'affiche pas une erreur (500, 404, 'Quelque chose s'est mal passé', stack trace) ?"
        severity_if_fail: 5

global_pass_threshold:
  blocker_severity: 4
