<text x="40" y="72" fill="#666" font-size="11">Source : ASML 2025 annual revenue split (jan. 2026)</text><rect x="80" y="110" width="217.8" height="60" fill="#ef4444"/><text x="188.9" y="145" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">33%</text><rect x="297.8" y="110" width="165" height="60" fill="#22d3ee"/><text x="380.3" y="145" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">25%</text><rect x="462.8" y="110" width="145.2" height="60" fill="#a78bfa"/><text x="535.4" y="145" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">22%</text><rect x="608" y="110" width="83.82000000000001" height="60" fill="#10b981"/><text x="649.91" y="145" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">12.7%</text><rect x="691.82" y="110" width="48.18" height="60" fill="#f59e0b"/><rect x="80" y="220" width="14" height="14" fill="#ef4444" rx="2"/><text x="100" y="231" fill="#333" font-size="12">Chine (33%)</text><rect x="215" y="220" width="14" height="14" fill="#22d3ee" rx="2"/><text x="235" y="231" fill="#333" font-size="12">Corée du Sud (25%)</text><rect x="350" y="220" width="14" height="14" fill="#a78bfa" rx="2"/><text x="370" y="231" fill="#333" font-size="12">Taïwan (22%)</text><rect x="485" y="220" width="14" height="14" fill="#10b981" rx="2"/><text x="505" y="231" fill="#333" font-size="12">USA (12.7%)</text><rect x="620" y="220" width="14" height="14" fill="#f59e0b" rx="2"/><text x="640" y="231" fill="#333" font-size="12">Autres (7.3%)</text><text x="80" y="305" fill="#666" font-size="11">Chine = 1er client 2025 (33 %). Attendu en baisse à ~20 % en 2026 (restrictions US).</text><text x="80" y="325" fill="#666" font-size="11">Taïwan, Corée, USA absorbent la demande EUV pour 3 nm, 2 nm, AI accélérateurs.</text>
