<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Machines EUV livrées par ASML (2020-2025)</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Unités EUV et DUV immersion expédiées chaque année</text>
<g transform="translate(60,110)">
<line x1="50" y1="220" x2="720" y2="220" stroke="#475569"/>
<line x1="50" y1="20" x2="50" y2="220" stroke="#475569"/>
