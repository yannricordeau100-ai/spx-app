<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:MtMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#0a0a0e"/>
<!-- Panel 1 ASML -->
<rect x="40" y="85" width="240" height="320" fill="#141418" stroke="#a78bfa" stroke-width="2" rx="8"/>
<text x="160" y="120" text-anchor="middle" fill="#a78bfa" font-size="22" font-weight="800" font-family="MtMono, 'JetBrains Mono', monospace">$ASML</text>
<line x1="80" y1="135" x2="240" y2="135" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
<text x="160" y="170" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">Sole provider of</text>
<text x="160" y="190" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">High-NA EUV</text>
<text x="160" y="210" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">lithography</text>
<text x="160" y="260" text-anchor="middle" fill="#fbbf24" font-size="32" font-weight="800" font-family="MtMono, 'JetBrains Mono', monospace">100 %</text>
<text x="160" y="280" text-anchor="middle" fill="#888" font-size="11">market share EUV</text>
<text x="60" y="330" fill="#bbb" font-size="11">The absolute physical</text>
<text x="60" y="346" fill="#bbb" font-size="11">bottleneck of the</text>
<text x="60" y="362" fill="#bbb" font-size="11">chip world.</text>
<!-- Panel 2 TSM -->
<rect x="290" y="85" width="240" height="320" fill="#141418" stroke="#60a5fa" stroke-width="2" rx="8"/>
<text x="410" y="120" text-anchor="middle" fill="#60a5fa" font-size="22" font-weight="800" font-family="MtMono, 'JetBrains Mono', monospace">$TSM</text>
<line x1="330" y1="135" x2="490" y2="135" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
<text x="410" y="170" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">Market leader in</text>
<text x="410" y="190" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">advanced AI</text>
<text x="410" y="210" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">foundry nodes</text>
<text x="410" y="260" text-anchor="middle" fill="#fbbf24" font-size="32" font-weight="800" font-family="MtMono, 'JetBrains Mono', monospace">92 %</text>
<text x="410" y="280" text-anchor="middle" fill="#888" font-size="11">share advanced nodes</text>
<text x="310" y="330" fill="#bbb" font-size="11">The only foundry with</text>
<text x="310" y="346" fill="#bbb" font-size="11">the scale to power</text>
<text x="310" y="362" fill="#bbb" font-size="11">the AGI era.</text>
<!-- Panel 3 AMZN -->
<rect x="540" y="85" width="240" height="320" fill="#141418" stroke="#10b981" stroke-width="2" rx="8"/>
<text x="660" y="120" text-anchor="middle" fill="#10b981" font-size="22" font-weight="800" font-family="MtMono, 'JetBrains Mono', monospace">$AMZN</text>
<line x1="580" y1="135" x2="740" y2="135" stroke="#10b981" stroke-width="1" opacity="0.4"/>
<text x="660" y="170" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">AWS dominance +</text>
<text x="660" y="190" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">logistics flywheel</text>
<text x="660" y="210" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">e-commerce</text>
<text x="660" y="260" text-anchor="middle" fill="#fbbf24" font-size="28" font-weight="800" font-family="MtMono, 'JetBrains Mono', monospace">$244B</text>
<text x="660" y="280" text-anchor="middle" fill="#888" font-size="11">AWS backlog</text>
<text x="560" y="330" fill="#bbb" font-size="11">Cloud + logistics moat</text>
<text x="560" y="346" fill="#bbb" font-size="11">now nearly impossible</text>
<text x="560" y="362" fill="#bbb" font-size="11">to replicate.</text>
<text x="40" y="430" fill="#888" font-size="10">Common trait: no challenger can replicate any of these 3 positions in less than 10 years.</text>
</svg>
