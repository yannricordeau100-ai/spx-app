<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:MtMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#fafafa"/>
<text x="400" y="48" text-anchor="middle" fill="#4b5563" font-size="11">Stranger ou candidat s&#233;rieux : valuation 200 Mds $ d&#233;but 2026</text>
<text x="210" y="100" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Utilisateurs X (MAU)</text>
<rect x="220" y="85" width="500" height="22" fill="#3b82f6" rx="3"/>
<text x="728" y="100" fill="#0a0a0a" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">550 M</text>
<text x="210" y="135" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Premium+ (acc&#232;s Grok)</text>
<rect x="220" y="120" width="14" height="22" fill="#a78bfa" rx="3"/>
<text x="242" y="135" fill="#0a0a0a" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">12 M</text>
<text x="210" y="170" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Grok WAU r&#233;el</text>
<rect x="220" y="155" width="40" height="22" fill="#f43f5e" rx="3"/>
<text x="268" y="170" fill="#0a0a0a" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">35 M</text>
<text x="210" y="205" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Revenu xAI 2026e</text>
<rect x="220" y="190" width="60" height="22" fill="#f59e0b" rx="3"/>
<text x="288" y="205" fill="#0a0a0a" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">1,5 Mds $</text>
<text x="210" y="240" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Valuation xAI 2026</text>
<rect x="220" y="225" width="400" height="22" fill="#10b981" rx="3"/>
<text x="628" y="240" fill="#0a0a0a" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">200 Mds $</text>
<g transform="translate(0,290)"><rect x="60" y="0" width="700" height="130" fill="#f3f4f6" rx="6" stroke="#e5e7eb"/>
<text x="80" y="22" fill="#0a0a0a" font-size="12" font-weight="600">Lecture</text>
<text x="80" y="42" fill="#4b5563" font-size="11">Grok b&#233;n&#233;ficie de l&apos;audience X (550 M MAU) mais ne convertit que 2 %.</text>
<text x="80" y="58" fill="#4b5563" font-size="11">Revenu 2026 sous 2 Mds $ : 30x moins qu&apos;OpenAI / Anthropic.</text>
<text x="80" y="74" fill="#4b5563" font-size="11">Mais valuation 200 Mds $ : pari sur le hardware (Colossus) + synergies Tesla / xAI.</text>
<text x="80" y="90" fill="#4b5563" font-size="11">Mod&#232;le Grok 4 / 5 progresse rapide sur les benchmarks mais reste niche.</text>
<text x="80" y="106" fill="#4b5563" font-size="11">Stratechery : &quot;Grok rest&#233; en queue de peloton sur l&apos;adoption grand public&quot;.</text>
</g>
</svg>
