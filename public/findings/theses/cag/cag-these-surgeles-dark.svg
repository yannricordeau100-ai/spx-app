<text data-axe="x" x="425" y="389.5" text-anchor="middle" fill="#bbb" font-size="11">Achètent du surgelé avec un repas ou un</text>
<text data-axe="x" x="425" y="402" text-anchor="middle" fill="#bbb" font-size="11">jour précis en tête</text>
