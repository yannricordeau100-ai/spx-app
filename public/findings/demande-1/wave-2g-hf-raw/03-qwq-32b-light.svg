    <rect x="22" y="201" width="20" height="179" fill="#10b981"/>
    <rect x="44" y="238" width="20" height="142" fill="#06b6d4"/>
    <rect x="66" y="223" width="20" height="157" fill="#f59e0b"/>
    <rect x="88" y="217" width="20" height="163" fill="#f43f5e"/>
