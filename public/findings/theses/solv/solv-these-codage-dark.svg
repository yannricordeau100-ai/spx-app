<text x="72" y="280" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">25</text>
<line x1="80" y1="194" x2="770" y2="194" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="198" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">50</text>
<line x1="80" y1="113" x2="770" y2="113" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="117" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">75</text>
<line x1="80" y1="32" x2="770" y2="32" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="36" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">100</text>
<text x="72" y="21" text-anchor="end" fill="#bbb" font-size="12" font-family="MtMono, 'JetBrains Mono', monospace">%</text>
<rect x="114" y="97" width="66" height="260" fill="#a78bfa" rx="3"/>
<text x="147" y="91" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">80</text>
<text data-axe="x" x="149" y="379" text-anchor="middle" fill="#bbb" font-size="10">Agissent sur l'IA générative</text>
<text data-axe="x" x="149" y="390.5" text-anchor="middle" fill="#bbb" font-size="10">en facturation</text>
<rect x="252" y="149" width="66" height="208" fill="#a78bfa" rx="3"/>
<text x="285" y="143" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">64</text>
<text data-axe="x" x="287" y="379" text-anchor="middle" fill="#bbb" font-size="10">Grands systèmes en pilote</text>
<text data-axe="x" x="287" y="390.5" text-anchor="middle" fill="#bbb" font-size="10">ou déploiement</text>
<rect x="390" y="292" width="66" height="65" fill="#a78bfa" rx="3"/>
<text x="423" y="286" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">20</text>
<text data-axe="x" x="425" y="379" text-anchor="middle" fill="#bbb" font-size="10">Systèmes de 500 M$ à 1</text>
<text data-axe="x" x="425" y="390.5" text-anchor="middle" fill="#bbb" font-size="10">Md$ au même stade</text>
<rect x="528" y="68" width="66" height="289" fill="#a78bfa" rx="3"/>
<text x="561" y="62" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">89</text>
<text data-axe="x" x="563" y="379" text-anchor="middle" fill="#bbb" font-size="10">Jugent que des codes</text>
<text data-axe="x" x="563" y="390.5" text-anchor="middle" fill="#bbb" font-size="10">inexacts pèsent sur les</text>
<text data-axe="x" x="563" y="402" text-anchor="middle" fill="#bbb" font-size="10">recettes</text>
<rect x="666" y="162" width="66" height="195" fill="#a78bfa" rx="3"/>
<text x="699" y="156" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">60</text>
<text data-axe="x" x="701" y="379" text-anchor="middle" fill="#bbb" font-size="10">Voient l'opportunité dans</text>
<text data-axe="x" x="701" y="390.5" text-anchor="middle" fill="#bbb" font-size="10">les remboursements</text>
<text data-axe="x" x="701" y="402" text-anchor="middle" fill="#bbb" font-size="10">manqués</text>
