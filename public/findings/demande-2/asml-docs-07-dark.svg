<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui">
<rect width="800" height="450" fill="#0a0a0e"/>
<text x="40" y="34" fill="#fafafa" font-size="16" font-weight="700">ASML : systèmes lithographie livrés 2021-2025 + jalon High-NA</text>
<text x="40" y="54" fill="#888" font-size="11">unités. Source : ASML Q4 2025 Presentation IR (slide 18) — 28 jan 2026</text>
<line x1="80" y1="100" x2="770" y2="100" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="104" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">500</text>
<line x1="80" y1="170" x2="770" y2="170" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="174" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">400</text>
<line x1="80" y1="240" x2="770" y2="240" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="244" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">300</text>
<line x1="80" y1="310" x2="770" y2="310" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="314" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">200</text>
<line x1="80" y1="380" x2="770" y2="380" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="384" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">0</text>
<!-- y mapping : 380 - val * 0.56 (since 500 maps from 380 down to 100 = 280 height for 500 units) -->
<!-- Actually 0=380, 500=100, so y = 380 - (val/500)*280 = 380 - val*0.56 -->
<!-- 2021=309 -> 380 - 173 = 207 -->
<!-- 2022=345 -> 380 - 193 = 187 -->
<!-- 2023=449 -> 380 - 251 = 129 -->
<!-- 2024=418 -> 380 - 234 = 146 -->
<!-- 2025=327 -> 380 - 183 = 197 -->
<rect x="115" y="207" width="70" height="173" fill="#a78bfa" rx="3"/>
<text x="150" y="201" text-anchor="middle" fill="#fafafa" font-size="11" font-family="ui-monospace">309</text>
<text x="150" y="402" text-anchor="middle" fill="#bbb" font-size="11">2021</text>
<rect x="225" y="187" width="70" height="193" fill="#a78bfa" rx="3"/>
<text x="260" y="181" text-anchor="middle" fill="#fafafa" font-size="11" font-family="ui-monospace">345</text>
<text x="260" y="402" text-anchor="middle" fill="#bbb" font-size="11">2022</text>
<rect x="335" y="129" width="70" height="251" fill="#a78bfa" rx="3"/>
<text x="370" y="123" text-anchor="middle" fill="#fafafa" font-size="11" font-family="ui-monospace">449</text>
<text x="370" y="402" text-anchor="middle" fill="#bbb" font-size="11">2022</text>
<text x="370" y="402" text-anchor="middle" fill="#bbb" font-size="11">2023</text>
<rect x="445" y="146" width="70" height="234" fill="#a78bfa" rx="3"/>
<text x="480" y="140" text-anchor="middle" fill="#fafafa" font-size="11" font-family="ui-monospace">418</text>
<text x="480" y="402" text-anchor="middle" fill="#bbb" font-size="11">2024</text>
<rect x="555" y="197" width="70" height="183" fill="#10b981" rx="3"/>
<text x="590" y="191" text-anchor="middle" fill="#fafafa" font-size="11" font-family="ui-monospace">327</text>
<text x="590" y="402" text-anchor="middle" fill="#bbb" font-size="11">2025</text>
<!-- Right side bonus -->
<rect x="640" y="125" width="130" height="180" fill="#0f0f15" stroke="#22d3ee" rx="6"/>
<text x="705" y="150" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">Mix 2025</text>
<text x="660" y="178" fill="#bbb" font-size="10">EUV</text>
<text x="755" y="178" text-anchor="end" fill="#fafafa" font-size="11" font-family="ui-monospace">48</text>
<text x="660" y="200" fill="#bbb" font-size="10">DUV</text>
<text x="755" y="200" text-anchor="end" fill="#fafafa" font-size="11" font-family="ui-monospace">279</text>
<text x="660" y="222" fill="#bbb" font-size="10">dont immersion</text>
<text x="755" y="222" text-anchor="end" fill="#fafafa" font-size="11" font-family="ui-monospace">47 %</text>
<text x="660" y="252" fill="#10b981" font-size="10" font-weight="600">EUV revenu</text>
<text x="755" y="252" text-anchor="end" fill="#10b981" font-size="11" font-family="ui-monospace">11,6 Md€</text>
<text x="660" y="270" fill="#10b981" font-size="9">ASP ~242 M€/sys</text>
<text x="660" y="294" fill="#22d3ee" font-size="10" font-weight="600">High-NA shipped</text>
<text x="755" y="294" text-anchor="end" fill="#22d3ee" font-size="11" font-family="ui-monospace">1er EXE:5200B</text>
<text x="400" y="430" text-anchor="middle" fill="#888" font-size="10">Premier EXE:5200B (High-NA) reconnu en revenu en 2025 — prix unitaire ~350 M €</text>
</svg>
