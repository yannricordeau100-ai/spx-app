name: VIP Inspection Worker

# Yann 17 mai 2026 : worker GitHub Action qui exécute automatiquement
# vip-deep-inspection.py pour les tickers que l'utilisateur a "lancé"
# depuis /sandbox/vip-inspection (state='running' dans Supabase).
#
# Sécurité : utilise 3 secrets GitHub repo settings :
#   - SUPABASE_URL                (= NEXT_PUBLIC_SUPABASE_URL)
#   - SUPABASE_SERVICE_ROLE_KEY
#   - GEMINI_API_KEY              (pour Gemini 2.5 Flash)

on:
  schedule:
    # Cron de filet de sécurité : 1×/h. Yann 17 mai 2026 : repo privé,
    # quota 2000 min/mois. Calcul : 24 skips/jour × 1.5 min = ~1080 min/mois
    # rien qu'en skips, laisse ~920 min pour les inspections réelles
    # (~60 inspections/mois = ~2 stés/jour).
    # Le déclencheur principal = repository_dispatch (webhook depuis Vercel
    # API quand l'user clique "Lancer" UI → 0 skip, ~150 stés/mois possible).
    - cron: '0 * * * *'
  repository_dispatch:
    # Déclenché par /api/vip-inspection POST action=launch via GitHub API.
    # Type d'event = 'vip-inspection-launch'.
    types: [vip-inspection-launch]
  workflow_dispatch: # bouton manuel "Run workflow" depuis l'UI Actions
    inputs:
      ticker:
        description: 'Ticker spécifique (optionnel, sinon tous les running)'
        required: false
        type: string

# Yann 18 mai 2026 : jusqu'à 5 inspections parallèles (concurrency par ticker).
# RAM impact estimé : 5 × ~250 MB Chrome headless = ~1,25 GB + 5 × ~50 MB
# Python = ~1,5 GB total côté Mac runner self-hosted.
concurrency:
  group: vip-inspection-${{ github.event.client_payload.ticker || github.event.inputs.ticker || 'all-queued' }}
  cancel-in-progress: false

jobs:
  inspect:
    # Self-hosted Mac runner Yann (gratuit, illimité, Mac doit être allumé).
    # Yann 17 mai 2026.
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 + Node 22 déjà installés sur le Mac Yann (vérifié).
      # On skip setup-python/setup-node = gain temps + RAM.

      - name: Install Python deps (certifi only)
        run: pip3 install --user --quiet certifi || true

      - name: Install Node deps (Supabase client only, no-save)
        run: npm install --no-save --silent @supabase/supabase-js

      - name: Sync Supabase → JSON local
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/vip-worker-sync-down.js

      - name: Check if any running tickers
        id: check
        run: |
          RUNNING=$(node -e "const j=require('./src/data/vip-inspection-status.json'); console.log(Object.values(j.results||{}).filter(s=>s.state==='running').map(s=>s.ticker).join(' '))")
          echo "running_tickers=$RUNNING" >> $GITHUB_OUTPUT
          if [ -z "$RUNNING" ]; then echo "✅ Aucun ticker à inspecter. Skip."; fi

      - name: Run VIP inspection (Chrome headless + Gemini)
        if: steps.check.outputs.running_tickers != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Yann 18 mai 2026 : token bypass auth gate pour Chrome headless
          # visiter les pages staging /sandbox/v1-8/<ticker>?audit_token=...
          VISUAL_AUDIT_TOKEN: ${{ secrets.VISUAL_AUDIT_TOKEN }}
        run: |
          # Chrome path Mac Yann (self-hosted runner)
          export CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          # Source ticker possible : (1) workflow_dispatch input, (2) repository_dispatch payload, (3) all-queued
          TICKER="${{ github.event.inputs.ticker || github.event.client_payload.ticker }}"
          # Yann 19 mai 2026 : ticker spécial '__all_queued__' = mode batch
          # (lance depuis l'UI bouton "Lancer TOUTES" sur /sandbox/vip-inspection).
          # Le script traite les state='running' de Supabase 1 par 1.
          if [ -n "$TICKER" ] && [ "$TICKER" != "__all_queued__" ]; then
            python3 scripts/vip-deep-inspection.py --ticker "$TICKER"
          else
            # Mode batch séquentiel : 1 sté à la fois jusqu'à épuisement de la queue
            python3 scripts/vip-deep-inspection.py --all-queued
          fi

      - name: Sync JSON local → Supabase (results)
        if: steps.check.outputs.running_tickers != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/vip-worker-sync-up.js

      - name: Summary
        if: always()
        run: |
          echo "## VIP Inspection Worker Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Running tickers : ${{ steps.check.outputs.running_tickers }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered at : $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
