<text data-axe="x" x="282" y="220" text-anchor="middle" fill="#444" font-size="13">Associent frais</text>
<text data-axe="x" x="282" y="234.5" text-anchor="middle" fill="#444" font-size="13">et surgelé</text>
<text data-axe="x" x="282" y="249" text-anchor="middle" fill="#444" font-size="13">dans le même</text>
