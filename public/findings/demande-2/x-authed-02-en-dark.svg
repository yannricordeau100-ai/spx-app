<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui">
<rect width="800" height="450" fill="#0a0a0e"/>
<text x="40" y="32" fill="#fafafa" font-size="16" font-weight="700">ASML Multi-Year Financial Trajectory (2020 to 2024)</text>
<text x="40" y="52" fill="#888" font-size="11">Operating revenue CAGR 14.4 %, EPS CAGR 17.7 %. Source: FinChat via @TacticzH (X)</text>
<!-- Y axis grid -->
<line x1="80" y1="100" x2="770" y2="100" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="104" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">32 $B</text>
<line x1="80" y1="170" x2="770" y2="170" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="174" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">24 $B</text>
<line x1="80" y1="240" x2="770" y2="240" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="244" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">16 $B</text>
<line x1="80" y1="310" x2="770" y2="310" stroke="#1f1f24" stroke-width="1"/>
<text x="72" y="314" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">8 $B</text>
<line x1="80" y1="340" x2="770" y2="340" stroke="#444" stroke-width="1"/>
<text x="72" y="344" text-anchor="end" fill="#888" font-size="11" font-family="ui-monospace">0</text>
<!-- Bars: 2020=17.08, 2021=21.18, 2022=22.67, 2023=30.42, 2024=29.28 -->
<!-- Scale: 32B at y=100, 0 at y=340, so 7.5px per B -->
<!-- 2020 -->
<rect x="110" y="212" width="100" height="128" fill="#60a5fa" rx="3"/>
<text x="160" y="205" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700" font-family="ui-monospace">$17.1B</text>
<text x="160" y="362" text-anchor="middle" fill="#bbb" font-size="12" font-weight="600">2020</text>
<!-- 2021 -->
<rect x="230" y="181" width="100" height="159" fill="#60a5fa" rx="3"/>
<text x="280" y="174" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700" font-family="ui-monospace">$21.2B</text>
<text x="280" y="362" text-anchor="middle" fill="#bbb" font-size="12" font-weight="600">2021</text>
<!-- 2022 -->
<rect x="350" y="170" width="100" height="170" fill="#60a5fa" rx="3"/>
<text x="400" y="163" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700" font-family="ui-monospace">$22.7B</text>
<text x="400" y="362" text-anchor="middle" fill="#bbb" font-size="12" font-weight="600">2022</text>
<!-- 2023 -->
<rect x="470" y="112" width="100" height="228" fill="#a78bfa" rx="3"/>
<text x="520" y="105" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700" font-family="ui-monospace">$30.4B</text>
<text x="520" y="362" text-anchor="middle" fill="#bbb" font-size="12" font-weight="600">2023</text>
<!-- 2024 -->
<rect x="590" y="120" width="100" height="220" fill="#a78bfa" rx="3"/>
<text x="640" y="113" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700" font-family="ui-monospace">$29.3B</text>
<text x="640" y="362" text-anchor="middle" fill="#bbb" font-size="12" font-weight="600">2024</text>
<!-- KPI overlay box -->
<rect x="110" y="385" width="580" height="50" fill="#141418" stroke="#2a2a32" stroke-width="1" rx="4"/>
<text x="150" y="404" fill="#10b981" font-size="12" font-weight="700" font-family="ui-monospace">+14.4 %</text>
<text x="150" y="420" fill="#888" font-size="10">Revenue CAGR 5y</text>
<text x="320" y="404" fill="#fbbf24" font-size="12" font-weight="700" font-family="ui-monospace">48.6 % to 51.3 %</text>
<text x="320" y="420" fill="#888" font-size="10">Gross Margin (+1.3 pts CAGR)</text>
<text x="540" y="404" fill="#10b981" font-size="12" font-weight="700" font-family="ui-monospace">+17.7 %</text>
<text x="540" y="420" fill="#888" font-size="10">EPS CAGR per year</text>
</svg>
