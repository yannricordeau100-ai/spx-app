<text x="72" y="384" text-anchor="end" fill="#888" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">46 %</text>
<!-- Points : Q4'24=51.7 Q1'25=54.0 Q2'25=53.7 Q3'25=51.6 Q4'25=52.2 -->
<!-- Y mapping: y = 100 + ( (58 - val) * 70/3 ) -->
<!-- Q4'24 51.7 -> y = 100 + (6.3*70/3) = 100 + 147 = 247 -->
<!-- Q1'25 54.0 -> y = 100 + (4.0*70/3) = 100 + 93.3 = 193.3 -->
<!-- Q2'25 53.7 -> y = 100 + 4.3*70/3 = 100 + 100.3 = 200.3 -->
<!-- Q3'25 51.6 -> y = 100 + 6.4*70/3 = 100 + 149.3 = 249.3 -->
<!-- Q4'25 52.2 -> y = 100 + 5.8*70/3 = 100 + 135.3 = 235.3 -->
<polyline points="170,247 280,193 390,200 500,249 610,235" fill="none" stroke="#a78bfa" stroke-width="3"/>
<circle cx="170" cy="247" r="6" fill="#a78bfa"/>
<text x="170" y="270" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">51,7 %</text>
<text x="170" y="395" text-anchor="middle" fill="#bbb" font-size="11">Q4 2024</text>
<circle cx="280" cy="193" r="6" fill="#a78bfa"/>
<text x="280" y="184" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">54,0 %</text>
<text x="280" y="395" text-anchor="middle" fill="#bbb" font-size="11">Q1 2025</text>
<circle cx="390" cy="200" r="6" fill="#a78bfa"/>
<text x="390" y="191" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">53,7 %</text>
<text x="390" y="395" text-anchor="middle" fill="#bbb" font-size="11">Q2 2025</text>
<circle cx="500" cy="249" r="6" fill="#a78bfa"/>
<text x="500" y="270" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">51,6 %</text>
<text x="500" y="395" text-anchor="middle" fill="#bbb" font-size="11">Q3 2025</text>
<circle cx="610" cy="235" r="6" fill="#10b981"/>
<text x="610" y="226" text-anchor="middle" fill="#fafafa" font-size="11" font-family="MtMono, 'JetBrains Mono', monospace">52,2 %</text>
<text x="610" y="395" text-anchor="middle" fill="#bbb" font-size="11">Q4 2025</text>
<!-- Guidance band 51-53 -->
<rect x="650" y="217" width="120" height="44" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-dasharray="3 3"/>
<text x="710" y="246" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">51-53 %</text>
<text x="710" y="208" text-anchor="middle" fill="#22d3ee" font-size="10">guidance 2026</text>
<text x="400" y="430" text-anchor="middle" fill="#888" font-size="10">Modèle long-terme 2030 (Investor Day 2024) : marge brute 56-60 %</text>
</svg>
