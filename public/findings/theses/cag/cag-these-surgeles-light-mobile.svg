<text x="179" y="38" text-anchor="middle" fill="#0a0a0e" font-size="13" font-family="MtMono, 'JetBrains Mono', monospace">77</text>
<text data-axe="x" x="181" y="220" text-anchor="middle" fill="#444" font-size="13">Achètent du</text>
<text data-axe="x" x="181" y="234.5" text-anchor="middle" fill="#444" font-size="13">surgelé avec</text>
<text data-axe="x" x="181" y="249" text-anchor="middle" fill="#444" font-size="13">un repas ou un</text>
<text data-axe="x" x="181" y="263.5" text-anchor="middle" fill="#444" font-size="13">jour précis en</text>
<text data-axe="x" x="181" y="278" text-anchor="middle" fill="#444" font-size="13">tête</text>
