    <rect x="22" y="193" width="20" height="187" fill="#10b981"/>
    <rect x="44" y="190" width="20" height="190" fill="#06b6d4"/>
    <rect x="66" y="202" width="20" height="178" fill="#f59e0b"/>
    <rect x="88" y="218" width="20" height="162" fill="#f43f5e"/>
    <text x="54" y="187" font-size="10" font-weight="700" fill="#0a0a0a" text-anchor="middle">83.9</text>
    <text x="54" y="395" font-size="10" fill="#525252" text-anchor="middle">IFEval</text>
  </g>
  <!-- BFCL : 66.4, 60.3, 62.8, 49.3, 53.5 -->
  <g transform="translate(630,0)">
    <rect x="0" y="231" width="20" height="149" fill="#a78bfa"/>
    <rect x="22" y="245" width="20" height="135" fill="#10b981"/>
    <rect x="44" y="240" width="20" height="140" fill="#06b6d4"/>
    <rect x="66" y="270" width="20" height="110" fill="#f59e0b"/>
    <rect x="88" y="260" width="20" height="120" fill="#f43f5e"/>
