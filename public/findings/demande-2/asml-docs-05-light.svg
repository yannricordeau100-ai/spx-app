<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#fafafa"/>
<text x="100" y="180" fill="#333" font-size="12">EUV</text>
<rect x="120" y="160" width="213" height="60" fill="#059669" rx="3"/>
<text x="226" y="195" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">11,6 Mds €</text>
<text x="226" y="240" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">35,5 % du revenu</text>
<text x="226" y="256" text-anchor="middle" fill="#555" font-size="10">+39 % vs 2024</text>
<text x="100" y="290" fill="#333" font-size="12">DUV</text>
