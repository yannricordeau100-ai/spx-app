<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui">
<rect width="800" height="450" fill="#fafafa"/>
<text x="40" y="32" fill="#0a0a0e" font-size="16" font-weight="700">Global EUV Lithography Market: 9.4 → 25.3 €Bn (2023–2028)</text>
<text x="40" y="52" fill="#666" font-size="11">CAGR 21.8 %. Source: Research and Markets via @Caesar__Capital (X, Oct 2024)</text>
<line x1="80" y1="100" x2="770" y2="100" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="104" text-anchor="end" fill="#666" font-size="11" font-family="ui-monospace">30 $B</text>
<line x1="80" y1="180" x2="770" y2="180" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="184" text-anchor="end" fill="#666" font-size="11" font-family="ui-monospace">20 $B</text>
<line x1="80" y1="260" x2="770" y2="260" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="264" text-anchor="end" fill="#666" font-size="11" font-family="ui-monospace">10 $B</text>
<line x1="80" y1="340" x2="770" y2="340" stroke="#d4d4d8" stroke-width="1"/>
<text x="72" y="344" text-anchor="end" fill="#666" font-size="11" font-family="ui-monospace">0 $B</text>
<rect x="220" y="265" width="160" height="75" fill="#eab308" rx="4"/>
<text x="300" y="260" text-anchor="middle" fill="#0a0a0e" font-size="16" font-weight="700" font-family="ui-monospace">$9.4 B</text>
<text x="300" y="380" text-anchor="middle" fill="#444" font-size="13" font-weight="600">2023</text>
<rect x="500" y="138" width="160" height="202" fill="#2563eb" rx="4"/>
<text x="580" y="133" text-anchor="middle" fill="#0a0a0e" font-size="16" font-weight="700" font-family="ui-monospace">$25.3 B</text>
<text x="580" y="380" text-anchor="middle" fill="#444" font-size="13" font-weight="600">2028</text>
<text x="440" y="400" text-anchor="middle" fill="#059669" font-size="13" font-weight="600">CAGR 21.8 % per year</text>
<text x="40" y="430" fill="#666" font-size="10">ASML captures ~100 % of EUV lithography demand. Every chip below 7 nm requires its machines.</text>
</svg>
