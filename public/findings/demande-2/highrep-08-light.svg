<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#fafafa"/>
<text x="40" y="40" fill="#0a0a0e" font-size="20" font-weight="700">Tokyo Electron vs ASML : rôles complémentaires</text>
<text x="40" y="65" fill="#475569" font-size="13">Pas une rivalité directe : ASML domine la lithographie, TEL domine le coater/developer</text>
<g transform="translate(60,110)">
<g transform="translate(0,0)">
<rect width="320" height="220" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="8"/>
<text x="160" y="35" fill="#0a0a0e" font-size="16" font-weight="700" text-anchor="middle">Lithographie EUV</text>
<text x="160" y="55" fill="#475569" font-size="11" text-anchor="middle">(Photogravure UV extrême)</text>
<rect x="40" y="80" width="240" height="30" fill="#7c3aed"/>
<text x="160" y="100" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">ASML : 100%</text>
<rect x="40" y="120" width="0" height="30" fill="#94a3b8"/>
<text x="160" y="140" fill="#475569" font-size="12" text-anchor="middle">Tokyo Electron : 0%</text>
<text x="160" y="180" fill="#0a0a0e" font-size="12" text-anchor="middle">Marché global ~80 Mds €</text>
<text x="160" y="200" fill="#475569" font-size="11" text-anchor="middle">Croissance +20%/an (IA)</text>
</g>
<g transform="translate(360,0)">
<rect width="320" height="220" fill="#fff" stroke="#0891b2" stroke-width="2" rx="8"/>
<text x="160" y="35" fill="#0a0a0e" font-size="16" font-weight="700" text-anchor="middle">Coater / Developer</text>
<text x="160" y="55" fill="#475569" font-size="11" text-anchor="middle">(Application de la résine)</text>
<rect x="40" y="80" width="0" height="30" fill="#7c3aed"/>
<text x="160" y="100" fill="#475569" font-size="12" text-anchor="middle">ASML : 0%</text>
<rect x="40" y="120" width="200" height="30" fill="#0891b2"/>
<text x="160" y="140" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">Tokyo Electron : 88%</text>
<text x="160" y="180" fill="#0a0a0e" font-size="12" text-anchor="middle">Marché global ~15 Mds €</text>
<text x="160" y="200" fill="#475569" font-size="11" text-anchor="middle">Coopération R&amp;D avec ASML</text>
</g>
</g>
<text x="40" y="380" fill="#0a0a0e" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="405" fill="#475569" font-size="12">Tokyo Electron (8035.T) n'est PAS un concurrent direct d'ASML. Ils sont</text>
<text x="40" y="422" fill="#475569" font-size="12">partenaires : TEL livre l'enduiseur de résine qui s'intègre à la machine ASML.</text>
<text x="40" y="439" fill="#475569" font-size="12">Aucun équipementier asiatique (Nikon, Canon, Tokyo Electron) ne peut faire d'EUV.</text>
<text x="40" y="478" fill="#94a3b8" font-size="11">Source : Nikkei Asia, communiqué Tokyo Electron-imec-ASML High-NA Lab (2024)</text>
</svg>
