<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="800" height="450" fill="#0a0a0a"/>
  <text x="400" y="28" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">QwQ-32B vs DeepSeek-R1 vs OpenAI o1-mini — benchmarks officiels</text>
  <text x="400" y="48" font-size="11" fill="#525252" text-anchor="middle">Score (%) sur 5 benchmarks reasoning · publié par Qwen / Alibaba</text>

  <g font-size="10" fill="#0a0a0a">
    <rect x="40" y="62" width="10" height="10" fill="#a78bfa"/><text x="54" y="71">QwQ-32B</text>
    <rect x="120" y="62" width="10" height="10" fill="#10b981"/><text x="134" y="71">DeepSeek-R1-671B</text>
    <rect x="250" y="62" width="10" height="10" fill="#06b6d4"/><text x="264" y="71">OpenAI o1-mini</text>
    <rect x="355" y="62" width="10" height="10" fill="#f59e0b"/><text x="369" y="71">R1-Distill-Llama-70B</text>
    <rect x="500" y="62" width="10" height="10" fill="#f43f5e"/><text x="514" y="71">R1-Distill-Qwen-32B</text>
  </g>

  <line x1="60" y1="380" x2="760" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="60" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
  <g font-size="9" fill="#525252" text-anchor="end">
