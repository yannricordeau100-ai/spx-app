<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,sans-serif">
<rect width="800" height="500" fill="#0a0a0e"/>
<text x="40" y="40" fill="#fafafa" font-size="20" font-weight="700">Prix unitaire d'une machine ASML : jusqu'à 380 M$</text>
<text x="40" y="65" fill="#a0a0b0" font-size="13">Échelle des prix par génération (2026)</text>
<g transform="translate(60,110)">
<g><rect x="0" y="0" width="50" height="50" fill="#475569"/><text x="60" y="32" fill="#fafafa" font-size="13" font-weight="600">DUV i-line/KrF (sub-100nm)</text><text x="700" y="32" fill="#fafafa" font-size="14" text-anchor="end" font-weight="700">~5 M$</text></g>
<g transform="translate(0,65)"><rect x="0" y="0" width="120" height="50" fill="#64748b"/><text x="130" y="32" fill="#fafafa" font-size="13" font-weight="600">DUV ArF dry (90-65nm)</text><text x="700" y="32" fill="#fafafa" font-size="14" text-anchor="end" font-weight="700">~20 M$</text></g>
<g transform="translate(0,130)"><rect x="0" y="0" width="280" height="50" fill="#06b6d4"/><text x="290" y="32" fill="#fafafa" font-size="13" font-weight="600">DUV ArF immersion (28-7nm)</text><text x="700" y="32" fill="#fafafa" font-size="14" text-anchor="end" font-weight="700">~80 M$</text></g>
<g transform="translate(0,195)"><rect x="0" y="0" width="540" height="50" fill="#7c3aed"/><text x="550" y="32" fill="#fafafa" font-size="13" font-weight="600">EUV Low-NA NXE:3800E (5-3nm)</text><text x="700" y="32" fill="#fafafa" font-size="14" text-anchor="end" font-weight="700">~180 M$</text></g>
<g transform="translate(0,260)"><rect x="0" y="0" width="700" height="50" fill="#a855f7"/><text x="350" y="32" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">EUV High-NA EXE:5200B (2nm et au-delà)</text><text x="700" y="32" fill="#fff" font-size="15" text-anchor="end" font-weight="800">380 M$</text></g>
</g>
<text x="40" y="430" fill="#fafafa" font-size="13" font-weight="600">Lecture investisseur</text>
<text x="40" y="455" fill="#a0a0b0" font-size="12">Une seule machine High-NA EUV coûte 380 millions de dollars (le prix d'un</text>
<text x="40" y="472" fill="#a0a0b0" font-size="12">Boeing 787). Marge brute ASML 51,8% : plus le mix EUV monte, plus la rentabilité grimpe.</text>
<text x="40" y="492" fill="#64748b" font-size="11">Source : ASML 2025 Annual Report, Tom's Hardware roadmap (2025)</text>
</svg>
