    <text x="54" y="395" font-size="10" fill="#525252" text-anchor="middle">BFCL</text>
  </g>

  <text x="60" y="125" font-size="10" fill="#525252">Score (%)</text>
  <text x="60" y="430" font-size="10" fill="#525252">QwQ-32B (Alibaba) rivalise avec DeepSeek-R1 671B malgré 20x moins de paramètres.</text>
</svg>
