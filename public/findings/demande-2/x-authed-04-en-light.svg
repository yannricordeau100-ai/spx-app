<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="MtSans, Manrope, sans-serif">
<style>@font-face{font-family:MtSans;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:MtMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="800" height="450" fill="#fafafa"/>
<polygon points="340,80 460,80 480,150 320,150" fill="#059669" opacity="0.85" stroke="#0a0a0e" stroke-width="1"/>
<text x="400" y="110" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="800">EUV</text>
<text x="400" y="130" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700" font-family="MtMono, 'JetBrains Mono', monospace">100 % share</text>
<text x="500" y="115" fill="#059669" font-size="12" font-weight="700">Total monopoly</text>
<text x="500" y="132" fill="#666" font-size="10">No competitor in EUV lithography</text>
<polygon points="320,155 480,155 510,255 290,255" fill="#d97706" opacity="0.85" stroke="#0a0a0e" stroke-width="1"/>
<text x="400" y="195" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="800">DUV</text>
<text x="400" y="215" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700" font-family="MtMono, 'JetBrains Mono', monospace">90 % share</text>
<text x="400" y="235" text-anchor="middle" fill="#fafafa" font-size="11">Immersion + Dry</text>
<text x="530" y="200" fill="#d97706" font-size="12" font-weight="700">Strong leader</text>
<text x="530" y="217" fill="#666" font-size="10">Competitors: Nikon (immersion),</text>
<text x="530" y="232" fill="#666" font-size="10">Canon (dry)</text>
<polygon points="290,260 510,260 560,400 240,400" fill="#8b5cf6" opacity="0.85" stroke="#0a0a0e" stroke-width="1"/>
<text x="400" y="310" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="800">Metrology and Inspection</text>
<text x="400" y="335" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="700" font-family="MtMono, 'JetBrains Mono', monospace">Weakest position</text>
<text x="400" y="360" text-anchor="middle" fill="#fafafa" font-size="11">Main competitor: KLA Corp</text>
<text x="580" y="320" fill="#8b5cf6" font-size="12" font-weight="700">Challenger zone</text>
<text x="580" y="337" fill="#666" font-size="10">Lower share, more</text>
<text x="580" y="352" fill="#666" font-size="10">competitive intensity</text>
<text x="40" y="425" fill="#666" font-size="10">As you go down the pyramid, ASML market share drops and competition becomes meaningful.</text>
</svg>
