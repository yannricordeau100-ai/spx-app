<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui">
<rect width="800" height="450" fill="#fafafa"/>
<text x="400" y="28" text-anchor="middle" fill="#0a0a0a" font-size="18" font-weight="bold">Trafic moyen quotidien des chatbots IA — avril 2026</text>
<text x="400" y="46" text-anchor="middle" fill="#4b5563" font-size="11">Visites moyennes/jour (millions) · variation 4 semaines</text>
<g font-family="ui-monospace" font-size="11">
<text x="200" y="92" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">ChatGPT</text>
<rect x="210" y="78" width="600" height="22" fill="#a78bfa" rx="3"/>
<text x="816" y="93" fill="#0a0a0a">182.8M</text>
<text x="500" y="93" text-anchor="middle" fill="#fff" font-weight="600">+5%</text>
<text x="200" y="132" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Gemini</text>
<rect x="210" y="118" width="301" height="22" fill="#10b981" rx="3"/>
<text x="517" y="133" fill="#0a0a0a">91.6M</text>
<text x="360" y="133" text-anchor="middle" fill="#fff" font-weight="600">+9%</text>
<text x="200" y="172" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Claude</text>
<rect x="210" y="158" width="88" height="22" fill="#06b6d4" rx="3"/>
<text x="304" y="173" fill="#0a0a0a">26.8M (+26%)</text>
<text x="200" y="212" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">DeepSeek</text>
<rect x="210" y="198" width="44" height="22" fill="#f59e0b" rx="3"/>
<text x="260" y="213" fill="#0a0a0a">13.3M (+32%)</text>
<text x="200" y="252" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Grok</text>
<rect x="210" y="238" width="31" height="22" fill="#f43f5e" rx="3"/>
<text x="247" y="253" fill="#0a0a0a">9.5M (-21%)</text>
<text x="200" y="292" text-anchor="end" fill="#0a0a0a" font-size="12" font-weight="600">Perplexity</text>
<rect x="210" y="278" width="17" height="22" fill="#3b82f6" rx="3"/>
<text x="233" y="293" fill="#0a0a0a">5.2M (+2%)</text>
</g>
<g transform="translate(0,330)"><rect x="60" y="0" width="700" height="80" fill="#fff" rx="6" stroke="#e5e7eb"/>
<text x="80" y="22" fill="#0a0a0a" font-size="12" font-weight="600">Lecture</text>
<text x="80" y="42" fill="#4b5563" font-size="11">ChatGPT domine avec 182.8M visites/jour. Claude (+26%) et DeepSeek (+32%)</text>
<text x="80" y="58" fill="#4b5563" font-size="11">croissent le plus vite. Grok recule de 21% sur 4 semaines.</text>
</g>
</svg>
